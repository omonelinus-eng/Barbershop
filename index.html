<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Fikirini's Barbershop Manager</title>
<meta name="description" content="Full accountability system for sales, staff, stock, and cash." />
<meta name="theme-color" content="#15171C" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icons/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Fikirini's" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --ink:#15171C; --ink-soft:#1F222A; --paper:#EFEDE7; --paper-dim:#E4E1D8; --card:#FBFAF7; --line:#D8D4C8;
    --text:#1B1D22; --text-dim:#6B6A63; --red:#B23A34; --red-deep:#8C2C28; --blue:#2E4763; --gold:#A9782F; --green:#3E6B4F; --white:#FFFFFF;
    --font-d:'Fraunces',serif; --font-b:'Inter',sans-serif; --font-m:'IBM Plex Mono',monospace;
  }
  html.dark-mode{
    --paper:#14161B; --paper-dim:#1B1E24; --card:#1E2128; --line:#2C2F38;
    --text:#EDECE8; --text-dim:#9C9AA2;
  }
  html.dark-mode body{background:var(--paper);}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--text);font-family:var(--font-b);}
  ::selection{background:var(--red);color:#fff;}
  button{font-family:var(--font-b);cursor:pointer;transition:opacity .15s ease;}
  button:hover{opacity:.85;}
  button:disabled{opacity:.45;cursor:not-allowed;}
  input,select{font-family:var(--font-b);}
  input:focus,select:focus{outline:none;border-color:var(--red) !important;}
  a{color:inherit;}
  .hidden{display:none !important;}
  .mono{font-family:var(--font-m);}

  /* ---------- layout shell ---------- */
  #app-shell{display:flex;min-height:100vh;}
  .sidebar{width:252px;background:var(--ink);color:#fff;flex-shrink:0;position:sticky;top:0;height:100vh;
    display:flex;flex-direction:column;padding:20px 14px;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 6px 20px;}
  .stripe-mark{border-radius:999px;flex-shrink:0;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25);
    background:repeating-linear-gradient(45deg,var(--red) 0 6px,#fff 6px 12px,var(--blue) 12px 18px);}
  .brand-name{font-family:var(--font-d);font-size:16px;font-weight:700;line-height:1.1;}
  .brand-sub{font-family:var(--font-b);font-size:10.5px;color:#9A98A0;letter-spacing:.5px;}
  .nav-group{margin-bottom:16px;}
  .nav-group-label{font-size:10px;font-weight:700;color:#75737C;letter-spacing:1px;text-transform:uppercase;padding:0 10px 6px;}
  .nav-btn{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;border:none;
    cursor:pointer;margin-bottom:2px;background:transparent;color:#C9C7CF;font-size:13px;font-weight:500;text-align:left;}
  .nav-btn svg{flex-shrink:0;}
  .nav-btn.active{background:var(--red);color:#fff;font-weight:600;}
  .sidebar-foot{margin-top:auto;padding:12px 10px;border-top:1px solid #2A2C34;}
  .sidebar-foot .who-name{font-size:12.5px;font-weight:600;}
  .sidebar-foot .who-role{font-size:11px;color:#8B8992;}
  .sidebar-foot .foot-actions{display:flex;gap:6px;margin-top:10px;}
  .foot-btn{flex:1;font-size:11px;padding:6px 4px;border-radius:6px;border:1px solid #33353E;background:transparent;color:#C9C7CF;}

  main{flex:1;min-width:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;
    border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:5;gap:10px;flex-wrap:wrap;}
  .crumb{font-size:12.5px;color:var(--text-dim);}
  .crumb b{color:var(--text);font-weight:600;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .date-label{font-family:var(--font-m);font-size:12px;color:var(--text-dim);}
  .install-btn{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:7px;border:1px solid var(--line);
    background:var(--card);color:var(--text);font-size:12px;font-weight:600;}
  .page-wrap{padding:26px 28px 60px;max-width:1400px;}

  /* ---------- headers / cards ---------- */
  .section-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .eyebrow{font-size:11.5px;color:var(--red);font-weight:700;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:4px;}
  .h1{font-family:var(--font-d);font-size:28px;color:var(--text);margin:0;font-weight:600;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;}
  .stat-grid{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .stat-card{padding:16px 18px;flex:1;min-width:180px;}
  .stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .stat-label{font-size:12px;color:var(--text-dim);font-weight:600;letter-spacing:.3px;text-transform:uppercase;}
  .stat-value{font-family:var(--font-m);font-size:24px;color:var(--text);font-weight:600;}
  .stat-sub{font-size:12px;color:var(--text-dim);margin-top:4px;}

  /* ---------- pills / buttons ---------- */
  .pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.2px;display:inline-block;}
  .pill-neutral{background:#E7E4DA;color:var(--text-dim);}
  .pill-good{background:#E1EBE3;color:var(--green);}
  .pill-warn{background:#F3E6CF;color:var(--gold);}
  .pill-bad{background:#F3DEDB;color:var(--red-deep);}
  .pill-info{background:#DEE5EC;color:var(--blue);}
  .btn{padding:9px 14px;border-radius:8px;border:none;font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary{background:var(--red);color:#fff;}
  .btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--line);}
  .btn-sm{padding:5px 9px;font-size:11.5px;border-radius:6px;}
  .btn-danger{background:#F3DEDB;color:var(--red-deep);border:1px solid #E7C6C1;}
  .btn-ok{background:#E1EBE3;color:var(--green);border:1px solid #CFE2D4;}

  /* ---------- data table ---------- */
  .table-card{overflow:hidden;}
  .controls-bar{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .search-wrap{position:relative;flex:1 1 200px;min-width:180px;}
  .search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);pointer-events:none;}
  .search-input{width:100%;font-size:13px;padding:8px 10px 8px 30px;border:1px solid var(--line);border-radius:7px;
    background:var(--paper);color:var(--text);box-sizing:border-box;}
  .filter-select{font-size:12.5px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--text);}
  .count-label{font-family:var(--font-m);font-size:11.5px;color:var(--text-dim);margin-left:auto;white-space:nowrap;}
  .table-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;min-width:640px;}
  th{padding:10px 16px;cursor:pointer;user-select:none;font-size:11px;font-weight:700;color:var(--text-dim);
    letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--paper-dim);text-align:left;}
  .sort-ic{opacity:.45;font-size:10px;margin-left:3px;}
  td{padding:11px 16px;font-size:13px;color:var(--text);white-space:nowrap;border-bottom:1px solid var(--line);}
  tbody tr:hover td{background:var(--paper-dim);}
  .empty-row{text-align:center !important;padding:28px !important;color:var(--text-dim);white-space:normal !important;}
  .row-actions{display:flex;gap:6px;white-space:nowrap;}

  /* ---------- auth screens ---------- */
  #auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);padding:20px;}
  .auth-card{width:100%;max-width:380px;background:var(--card);border-radius:14px;padding:30px 28px;position:relative;overflow:hidden;}
  .auth-stripe{position:absolute;top:0;left:0;right:0;height:6px;background:repeating-linear-gradient(90deg,var(--red) 0 14px,#fff 14px 20px,var(--blue) 20px 34px);}
  .auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .auth-title{font-family:var(--font-d);font-size:20px;font-weight:600;margin:0 0 4px;}
  .auth-sub{font-size:12.5px;color:var(--text-dim);margin:0 0 20px;line-height:1.5;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--text-dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
  .field input,.field select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:13.5px;color:var(--text);}
  .auth-tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--paper);padding:4px;border-radius:9px;}
  .auth-tab{flex:1;padding:8px;border:none;border-radius:6px;background:transparent;font-size:12.5px;font-weight:600;color:var(--text-dim);}
  .auth-tab.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .auth-error{background:#F3DEDB;color:var(--red-deep);font-size:12.5px;padding:9px 11px;border-radius:8px;margin-bottom:14px;line-height:1.4;}
  .auth-note{background:#DEE5EC;color:var(--blue);font-size:12px;padding:9px 11px;border-radius:8px;margin-bottom:14px;line-height:1.4;}
  .auth-loading{color:#fff;font-family:var(--font-b);font-size:13px;text-align:center;}

  /* ---------- modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(21,23,28,.55);display:flex;align-items:center;justify-content:center;
    z-index:50;padding:16px;}
  .modal{width:100%;max-width:420px;background:var(--card);border-radius:12px;padding:24px;max-height:92vh;overflow-y:auto;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-title{font-family:var(--font-d);font-size:17px;font-weight:600;margin:0;}
  .modal-close{background:transparent;border:none;padding:4px;color:var(--text-dim);}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
  .credential-box{background:var(--ink);color:#fff;border-radius:9px;padding:14px;font-family:var(--font-m);font-size:12.5px;line-height:1.9;margin-top:10px;}
  .credential-box b{color:#F3E6CF;}

  /* ---------- toast ---------- */
  #toast-wrap{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:100;}
  .toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:8px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:320px;}

  /* ---------- pos ---------- */
  .pos-grid{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
  .pos-services{flex:1 1 320px;padding:16px;}
  .service-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
  .service-tile{text-align:left;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper);}
  .service-tile .n{font-size:12.5px;color:var(--text);font-weight:500;}
  .service-tile .p{font-size:11.5px;color:var(--text-dim);font-family:var(--font-m);}
  .ticket{flex:1 1 260px;background:var(--ink);border-radius:10px;padding:18px;color:#fff;position:relative;overflow:hidden;}
  .ticket-stripe{position:absolute;top:0;left:0;right:0;height:5px;background:repeating-linear-gradient(90deg,var(--red) 0 14px,#fff 14px 20px,var(--blue) 20px 34px);}
  .ticket-lines{margin-top:12px;display:flex;flex-direction:column;gap:6px;min-height:60px;}
  .ticket-line{display:flex;justify-content:space-between;font-family:var(--font-m);font-size:12.5px;}
  .ticket-empty{font-size:12.5px;color:#9A9CA6;opacity:.7;}
  .ticket-total{border-top:1px solid #333;margin-top:12px;padding-top:12px;display:flex;justify-content:space-between;
    font-family:var(--font-m);font-size:18px;font-weight:600;}
  .charge-btn{margin-top:14px;width:100%;padding:10px;border-radius:7px;border:none;background:var(--red);color:#fff;font-weight:600;font-size:13px;}

  /* ---------- dashboard chart ---------- */
  .dash-grid{display:flex;gap:16px;flex-wrap:wrap;}
  .chart-card{flex:2 1 380px;padding:18px;}
  .chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .chart-title{font-family:var(--font-d);font-size:16px;font-weight:600;}
  .chart-trend{display:flex;align-items:center;gap:4px;font-family:var(--font-m);font-size:12px;color:var(--green);}
  .bars{display:flex;align-items:flex-end;gap:14px;height:150px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .bar-val{font-family:var(--font-m);font-size:10.5px;color:var(--text-dim);}
  .bar{width:100%;max-width:34px;border-radius:4px 4px 0 0;background:var(--blue);}
  .bar.peak{background:var(--red);}
  .bar-day{font-size:11px;color:var(--text-dim);}
  .stock-card{flex:1 1 260px;padding:18px;}
  .stock-row{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:8px;}
  .stock-row:last-child{border:none;margin:0;padding:0;}
  .stock-name{font-size:13px;color:var(--text);font-weight:500;}
  .stock-meta{font-family:var(--font-m);font-size:11px;color:var(--text-dim);}

  /* ---------- dropdown (row actions) ---------- */
  .dropdown{position:relative;display:inline-block;}
  .dropdown-menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);
    border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.16);z-index:20;min-width:130px;padding:4px;}
  .dropdown-item{display:block;width:100%;text-align:left;padding:7px 10px;border:none;background:transparent;
    border-radius:6px;font-size:12.5px;color:var(--text);}
  .dropdown-item:hover{background:var(--paper-dim);}
  .dropdown-item.danger{color:var(--red-deep);}
  .inline-select{font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--text);}

  /* ---------- report tabs ---------- */
  .report-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .report-tab{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:12.5px;font-weight:600;}
  .report-tab.active{background:var(--red);color:#fff;border-color:var(--red);}

  /* ---------- ios install banner ---------- */
  #ios-banner{position:fixed;left:12px;right:12px;bottom:12px;background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;
    display:flex;align-items:center;gap:10px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3);}
  #ios-banner p{margin:0;font-size:12.5px;line-height:1.4;flex:1;}
  #ios-banner button{background:transparent;border:none;color:#9A9CA6;padding:4px;}

  @media (max-width:860px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .2s ease;}
    .sidebar.open{transform:translateX(0);}
    .menu-btn{display:inline-flex !important;}
    .page-wrap{padding:20px 16px 50px;}
    .topbar{padding:12px 16px;}
  }
  .menu-btn{display:none;background:transparent;border:none;color:var(--text);padding:6px;margin-right:4px;}

  /* ---------- settings page ---------- */
  .logo-preview{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--paper-dim);border:1px solid var(--line);flex-shrink:0;}
  .settings-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  .danger-zone{border:1px solid #E7C6C1;background:#FBF3F1;border-radius:10px;padding:16px;margin-top:8px;}
  html.dark-mode .danger-zone{background:#2A1917;border-color:#4A2B27;}

  /* ---------- powered-by footer ---------- */
  .powered-by{font-size:10.5px;color:#75737C;text-align:center;letter-spacing:.3px;margin-top:10px;}
  .powered-by b{color:#C9C7CF;font-weight:700;}
  .powered-by-doc{font-size:10.5px;color:var(--text-dim);text-align:center;margin-top:18px;padding-top:12px;border-top:1px solid var(--line);}
  .powered-by-doc b{color:var(--text);}

  /* ---------- theme toggle ---------- */
  .theme-toggle{display:flex;gap:8px;}
  .theme-opt{flex:1;padding:14px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--text);
    display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600;}
  .theme-opt.active{border-color:var(--red);background:var(--card);box-shadow:0 0 0 1.5px var(--red);}

  /* ---------- branded document header (reports / receipts on-screen) ---------- */
  .brand-doc-header{background:var(--ink);color:#fff;border-radius:10px;padding:18px 20px;margin-bottom:16px;position:relative;overflow:hidden;}
  .brand-doc-stripe{position:absolute;top:0;left:0;right:0;height:5px;background:repeating-linear-gradient(90deg,var(--red) 0 14px,#fff 14px 20px,var(--blue) 20px 34px);}
  .brand-doc-top{display:flex;align-items:center;gap:12px;margin-top:6px;flex-wrap:wrap;justify-content:space-between;}
  .brand-doc-id{display:flex;align-items:center;gap:10px;}
  .brand-doc-logo{width:38px;height:38px;border-radius:10px;flex-shrink:0;background:repeating-linear-gradient(45deg,var(--red) 0 6px,#fff 6px 12px,var(--blue) 12px 18px);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25);object-fit:cover;}
  .brand-doc-shop{font-family:var(--font-d);font-size:15px;font-weight:700;line-height:1.1;}
  .brand-doc-sub{font-size:10.5px;color:#9A98A0;letter-spacing:.4px;}
  .brand-doc-title{font-family:var(--font-d);font-size:19px;font-weight:600;text-align:right;}
  .brand-doc-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid #2A2C34;}
  .brand-doc-meta-item{font-size:11px;}
  .brand-doc-meta-item span{display:block;color:#8B8992;text-transform:uppercase;letter-spacing:.4px;font-size:9.5px;margin-bottom:2px;}
  .brand-doc-meta-item b{color:#fff;font-family:var(--font-m);font-weight:600;font-size:12px;}

  /* ---------- receipt modal ---------- */
  .receipt-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;}
  .receipt-lines{padding:14px 18px;}
  .receipt-line{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line);}
  .receipt-line:last-child{border-bottom:none;}
  .receipt-total-row{display:flex;justify-content:space-between;padding:12px 18px;background:var(--paper-dim);font-family:var(--font-m);font-weight:700;font-size:15px;}

  /* ---------- module access grid (staff creation) ---------- */
  .access-grid{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:4px;}
  .access-row{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:12.5px;border-bottom:1px solid var(--line);}
  .access-row:last-child{border-bottom:none;}
  .access-row:nth-child(even){background:var(--paper);}
  .access-row .am-label{flex:1;font-weight:500;}
  .access-row label{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-dim);white-space:nowrap;}
</style>
</head>
<body>
<script>
  try { if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark-mode"); } catch (e) {}
</script>

<!-- ============================= AUTH SCREEN ============================= -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-stripe"></div>
    <div class="auth-brand">
      <div class="stripe-mark" id="auth-brand-mark" style="width:30px;height:30px;"></div>
      <div>
        <div class="brand-name" id="auth-brand-name" style="color:var(--text);">Fikirini's</div>
        <div class="brand-sub" style="color:var(--text-dim);">BARBERSHOP MANAGER</div>
      </div>
    </div>
    <div id="auth-body"><div class="auth-loading" style="color:var(--text-dim);">Loading...</div></div>
  </div>
</div>

<!-- ============================= APP SHELL ============================= -->
<div id="app-shell" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="stripe-mark" id="side-brand-mark" style="width:30px;height:30px;"></div>
      <div>
        <div class="brand-name" id="side-brand-name">Fikirini's</div>

/* ============================================================
   LIVE FIRESTORE DATA STORE
   Every module in this app (Barbers, Services, Customers, Inventory,
   Suppliers, Expenses, Appointments, POS, Payroll, Reports, Audit)
   reads and writes real Firestore collections through DATA below.
   Make sure your Firestore rules allow authenticated read/write on:
   barbers, services, customers, inventory, suppliers, expenses,
   appointments, sales, audit — the same way 'users' already works.
   ============================================================ */
const COLLECTIONS = ["barbers", "services", "customers", "inventory", "suppliers", "expenses", "appointments", "sales",
  "purchases", "stockMovements", "attendance", "promotions", "deposits", "branches", "salaryPayments", "barberPay"];
const DATA = { barbers: [], services: [], customers: [], inventory: [], suppliers: [], expenses: [], appointments: [], sales: [],
  purchases: [], stockMovements: [], attendance: [], promotions: [], deposits: [], branches: [], salaryPayments: [], barberPay: [], audit: [] };
// BRANCHES stays a stable array reference (mutated in place) so every existing
// `options: BRANCHES` reference across the app reflects live Firestore data from
// the new Branches module, falling back to two sensible defaults until any
// branch documents exist.
const DEFAULT_BRANCH_NAMES = ["Main Branch", "Westlands Branch"];
const BRANCHES = [...DEFAULT_BRANCH_NAMES];
function syncBranchNames() {
  const names = DATA.branches.map((b) => b.name).filter(Boolean);
  const next = names.length ? names : DEFAULT_BRANCH_NAMES;
  BRANCHES.length = 0;
  BRANCHES.push(...next);
}
let dataUnsubs = [];

function subscribeAllData() {
  unsubscribeAllData();
  COLLECTIONS.forEach((name) => {
    const unsub = onSnapshot(collection(db, name), (snap) => {
      DATA[name] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (name === "branches") syncBranchNames();
      softRerender();
    }, (err) => console.error(`[${name}]`, err));
    dataUnsubs.push(unsub);
  });
  const auditUnsub = onSnapshot(query(collection(db, "audit"), orderBy("ms", "desc")), (snap) => {
    DATA.audit = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    softRerender();
  }, (err) => console.error("[audit]", err));
  dataUnsubs.push(auditUnsub);
}
function unsubscribeAllData() {
  dataUnsubs.forEach((u) => u());
  dataUnsubs = [];
}
// Re-render the current page in place whenever live data changes, but never
// steal focus from a search box the user is typing in, and never re-render
// while a modal is open (so an in-progress Add/Edit form isn't wiped out).
function softRerender() {
  const shell = document.getElementById("app-shell");
  if (!shell || shell.classList.contains("hidden")) return;
  if (document.getElementById("modal-overlay")) return;
  const active = document.activeElement;
  if (active && active.closest && active.closest("#page-wrap") &&
      ["INPUT", "SELECT", "TEXTAREA"].includes(active.tagName)) return;
  const renderFn = PAGE_RENDER[currentPage] || renderDashboard;
  renderFn(document.getElementById("page-wrap"));
}

function formFieldsHtml(fields, data) {

      return `<div class="field"><label>${escapeHtml(f.label)}</label><select id="f-${f.key}">
          ${f.options.map((o) => `<option value="${escapeHtml(o)}" ${String(val) === String(o) ? "selected" : ""}>${escapeHtml(o)}</option>`).join("")}
        </select></div>`;
    }
    return `<div class="field"><label>${escapeHtml(f.label)}</label>
        <input id="f-${f.key}" type="${f.type || "text"}" ${f.step ? `step="${f.step}"` : ""} value="${escapeHtml(val)}" placeholder="${escapeHtml(f.placeholder || "")}" /></div>`;
  }).join("");
}
function readFormFields(fields) {
  const out = {};
  fields.forEach((f) => {
    const el = document.getElementById(`f-${f.key}`);
    let v = el.value;
    if (f.type === "number") v = parseFloat(v) || 0;
    out[f.key] = v;
  });
  return out;
}

    <div id="em-error"></div>
    <div class="modal-actions"><button class="btn btn-ghost" id="em-cancel">Cancel</button><button class="btn btn-primary" id="em-save">${escapeHtml(cfg.saveLabel || "Save")}</button></div>
  `);
  document.getElementById("em-close").onclick = closeModal;
  document.getElementById("em-cancel").onclick = closeModal;
  document.getElementById("em-save").onclick = async () => {
    const btn = document.getElementById("em-save");
    const errEl = document.getElementById("em-error");
    errEl.innerHTML = "";
    const values = readFormFields(cfg.fields);
    const missing = cfg.fields.filter((f) => f.required && !String(values[f.key]).trim());
    if (missing.length) { errEl.innerHTML = `<div class="auth-error">Fill in: ${missing.map((f) => escapeHtml(f.label)).join(", ")}</div>`; return; }
    btn.disabled = true; btn.textContent = "Saving...";
    try { await cfg.onSave(values); closeModal(); }
    catch (err) {
      errEl.innerHTML = `<div class="auth-error">${escapeHtml(err.message || "Something went wrong.")}</div>`;
      btn.disabled = false; btn.textContent = cfg.saveLabel || "Save";
    }
  };
}
// A small "Actions ▾" dropdown used for Edit/Delete (and similar) on every row.
function actionsDropdown(rowId, actions) {
  if (!actions.length) return "";
  return `<div class="dropdown" data-row-id="${rowId}">
      <button class="btn btn-sm btn-ghost" data-act="__toggle">Actions ▾</button>
      <div class="dropdown-menu hidden">
        ${actions.map((a) => `<button class="dropdown-item ${a.danger ? "danger" : ""}" data-act="${a.act}">${escapeHtml(a.label)}</button>`).join("")}
      </div>
    </div>`;
}
document.addEventListener("click", (e) => {
  if (!e.target.closest(".dropdown")) document.querySelectorAll(".dropdown-menu").forEach((m) => m.classList.add("hidden"));
});
function wireActionsDropdown(container, handlers) {
  container.addEventListener("click", async (e) => {
    const toggle = e.target.closest('[data-act="__toggle"]');
    if (toggle) {
      const menu = toggle.nextElementSibling;
      document.querySelectorAll(".dropdown-menu").forEach((m) => { if (m !== menu) m.classList.add("hidden"); });
      menu.classList.toggle("hidden");
      return;
    }
    const btn = e.target.closest("button[data-act]");
    if (!btn || btn.dataset.act === "__toggle") return;
    const rowId = btn.closest("[data-row-id]")?.dataset.rowId;
    const handler = handlers[btn.dataset.act];
    if (handler && rowId) {
      document.querySelectorAll(".dropdown-menu").forEach((m) => m.classList.add("hidden"));
      await handler(rowId);
    }
  });
}

/* ============================================================
   GENERIC DATA TABLE  (search + filter + sort, used everywhere)
   ============================================================ */
function mountDataTable(container, opts) {
  const state = { search: "", filters: {}, sort: opts.defaultSort || { key: opts.columns[0].key, dir: "asc" } };

  container.innerHTML = `
    <div class="card table-card">
      <div class="controls-bar">
        <div class="search-wrap">${ICONS.search}<input class="search-input" placeholder="Search..." /></div>
        ${(opts.filters || []).map((f) => `
          <select class="filter-select" data-key="${f.key}">
            <option value="All">${escapeHtml(f.label)}: All</option>
            ${f.options.map((o) => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join("")}
          </select>`).join("")}
        <span class="count-label"></span>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr>
            ${opts.columns.map((c) => `<th data-key="${c.key}" style="text-align:${c.align || "left"}">${escapeHtml(c.label)}<span class="sort-ic"></span></th>`).join("")}
            ${opts.rowActions ? "<th>Actions</th>" : ""}
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>`;

  const searchInput = container.querySelector(".search-input");
  const tbody = container.querySelector("tbody");
  const countLabel = container.querySelector(".count-label");
  const ths = container.querySelectorAll("th[data-key]");

  function getRows() { return typeof opts.rows === "function" ? opts.rows() : opts.rows; }

  function computeRows() {
    let rows = getRows();
    if (state.search.trim()) {
      const q = state.search.toLowerCase();
      rows = rows.filter((r) => opts.searchKeys.some((k) => String(r[k] ?? "").toLowerCase().includes(q)));
    }
    Object.entries(state.filters).forEach(([k, v]) => { if (v && v !== "All") rows = rows.filter((r) => String(r[k]) === v); });
    rows = [...rows].sort((a, b) => {
      const av = a[state.sort.key], bv = b[state.sort.key];
      const an = parseFloat(String(av).replace(/[^0-9.-]/g, "")), bn = parseFloat(String(bv).replace(/[^0-9.-]/g, ""));
      let cmp;
      if (!isNaN(an) && !isNaN(bn) && String(av).match(/[0-9]/)) cmp = an - bn; else cmp = String(av).localeCompare(String(bv));
      return state.sort.dir === "asc" ? cmp : -cmp;
    });
    return rows;
  }

  function render() {
    const rows = computeRows();
    countLabel.textContent = `${rows.length} of ${getRows().length}`;
    ths.forEach((th) => {
      const ic = th.querySelector(".sort-ic");
      ic.textContent = state.sort.key === th.dataset.key ? (state.sort.dir === "asc" ? " ▲" : " ▼") : " ↕";
    });
    if (rows.length === 0) {
      tbody.innerHTML = `<tr><td colspan="${opts.columns.length + (opts.rowActions ? 1 : 0)}" class="empty-row">Nothing matches this filter. Adjust the search or filters above.</td></tr>`;
      return;
    }
    tbody.innerHTML = rows.map((r) => `<tr>
        ${opts.columns.map((c) => `<td style="text-align:${c.align || "left"}" class="${c.mono ? "mono" : ""}">${c.render ? c.render(r) : escapeHtml(r[c.key] ?? "")}</td>`).join("")}
        ${opts.rowActions ? `<td class="row-actions">${opts.rowActions(r)}</td>` : ""}
      </tr>`).join("");
  }

  searchInput.addEventListener("input", (e) => { state.search = e.target.value; render(); });
  container.querySelectorAll(".filter-select").forEach((sel) => {
    sel.addEventListener("change", () => { state.filters[sel.dataset.key] = sel.value; render(); });
  });
  ths.forEach((th) => {
    th.addEventListener("click", () => {
      const key = th.dataset.key;
      state.sort = state.sort.key === key ? { key, dir: state.sort.dir === "asc" ? "desc" : "asc" } : { key, dir: "asc" };
      render();
    });
  });
  if (opts.onMount) opts.onMount(container, render);
  render();
  return { refresh: render };
}

function sectionHeader(eyebrow, title, actionHtml) {
  return `<div class="section-header">
      <div><div class="eyebrow">${escapeHtml(eyebrow)}</div><h1 class="h1">${escapeHtml(title)}</h1></div>

}
function addBtn(label, id) { return `<button class="btn btn-primary" id="${id}">${ICONS.plus}${escapeHtml(label)}</button>`; }

function computeInvStatus(item) {
  const stock = item.stock || 0, reorder = item.reorder || 0;
  if (stock <= 0 || stock <= reorder * 0.5) return "Critical";
  if (stock <= reorder) return "Low";
  return "OK";
}

function renderDashboard(root) {
  const salesLive = DATA.sales.filter((s) => !s.voided);
  const today = todayStr();
  const todaySales = salesLive.filter((s) => s.date === today);
  const todayRevenue = todaySales.reduce((a, s) => a + (s.amount || 0), 0);
  const todayAppts = DATA.appointments.filter((a) => a.date === today);
  const walkins = todayAppts.filter((a) => a.type === "Walk-in").length;
  const lowStock = DATA.inventory.filter((i) => computeInvStatus(i) !== "OK");

  const monthPrefix = today.slice(0, 7);
  const revByBarber = new Map();
  salesLive.filter((s) => (s.date || "").startsWith(monthPrefix)).forEach((s) => revByBarber.set(s.barber, (revByBarber.get(s.barber) || 0) + (s.amount || 0)));
  let topBarber = "—", topBarberRev = 0;
  revByBarber.forEach((v, k) => { if (v > topBarberRev) { topBarberRev = v; topBarber = k; } });

  const dateSet = [...new Set(salesLive.map((s) => s.date).filter(Boolean))].sort().slice(-7);
  const trend = dateSet.map((d) => ({
    day: new Date(d + "T00:00:00").toLocaleDateString("en-KE", { weekday: "short" }),
    value: salesLive.filter((s) => s.date === d).reduce((a, s) => a + (s.amount || 0), 0),
  }));
  const maxRev = Math.max(1, ...trend.map((r) => r.value));

  root.innerHTML = `
    ${sectionHeader(new Date().toLocaleDateString("en-KE", { weekday: "long", day: "2-digit", month: "short", year: "numeric" }), "Dashboard")}
    <div class="stat-grid">
      <div class="card stat-card"><div class="stat-top"><span class="stat-label">Revenue Today</span></div><div class="stat-value">${money(todayRevenue)}</div><div class="stat-sub">${todaySales.length} receipt${todaySales.length === 1 ? "" : "s"} so far</div></div>
      <div class="card stat-card"><div class="stat-top"><span class="stat-label">Appointments Today</span></div><div class="stat-value">${todayAppts.length}</div><div class="stat-sub">${walkins} walk-in${walkins === 1 ? "" : "s"}</div></div>
      <div class="card stat-card"><div class="stat-top"><span class="stat-label">Top Barber (mo.)</span></div><div class="stat-value">${escapeHtml(topBarber)}</div><div class="stat-sub">${money(topBarberRev)} this month</div></div>
      <div class="card stat-card"><div class="stat-top"><span class="stat-label">Low Stock Items</span></div><div class="stat-value">${lowStock.length}</div><div class="stat-sub">Needs reorder</div></div>
    </div>
    <div class="dash-grid">
      <div class="card chart-card">
        <div class="chart-head"><span class="chart-title">Revenue, recent days</span></div>
        ${trend.length ? `<div class="bars">
            ${trend.map((r) => `<div class="bar-col"><div class="bar-val">${Math.round(r.value / 1000)}k</div>
              <div class="bar ${r.value === maxRev ? "peak" : ""}" style="height:${Math.max(4, (r.value / maxRev) * 100)}px;"></div>
              <div class="bar-day">${r.day}</div></div>`).join("")}
          </div>` : `<div style="font-size:12.5px;color:var(--text-dim);">No sales recorded yet — charge your first sale in Point of Sale.</div>`}
      </div>
      <div class="card stock-card">
        <span class="chart-title">Stock alerts</span>
        <div style="margin-top:12px;">
          ${lowStock.length ? lowStock.map((i) => `<div class="stock-row"><div><div class="stock-name">${escapeHtml(i.name)}</div><div class="stock-meta">${i.stock || 0} left · reorder at ${i.reorder || 0}</div></div>${pill(computeInvStatus(i))}</div>`).join("") : `<div style="font-size:12.5px;color:var(--text-dim);">Everything is well stocked.</div>`}
        </div>
      </div>
    </div>`;
}

        <div style="border-top:1px solid var(--line);margin:8px 0;"></div>

      </div>
      <div class="receipt-total-row"><span>Total</span><span>${money(sale.amount)}</span></div>
      <div class="powered-by-doc" style="border:none;margin:0;padding:10px 16px 14px;">Powered by <b>Omlin</b></div>

  </div></div>`;

function downloadReceiptPDF(sale, receiptNo, when) {
  const pdf = newBrandedDoc(); if (!pdf) return;
  const identifiers = [
    { label: "Receipt No.", value: receiptNo }, { label: "Date & time", value: when },
    { label: "Customer type", value: sale.customerType || "Walk-in" }, { label: "Payment", value: sale.method || "—" },
  ];
  let y = drawBrandedHeader(pdf, "Service Receipt", identifiers);
  pdf.setFont("helvetica", "bold"); pdf.setFontSize(9.5); pdf.setTextColor(27, 29, 34);
  pdf.text(`Customer: ${sale.customer || "Walk-in"}`, 40, y + 6);
  pdf.text(`Barber: ${sale.barber || "—"}`, 300, y + 6);
  pdf.setFont("helvetica", "normal");
  pdf.text(`Branch: ${sale.branch || "—"}`, 40, y + 22);
  pdf.text(`Cashier: ${sale.cashier || "—"}`, 300, y + 22);
  y += 38;
  pdf.autoTable({
    startY: y,
    head: [["Service", "Price"]],
    body: (sale.items || []).map((it) => [it.name, money(it.price)]),
    foot: [["Total", money(sale.amount)]],
    margin: { left: 40, right: 40, bottom: 44 },
    styles: { font: "helvetica", fontSize: 9.5, cellPadding: 6, textColor: [27, 29, 34], lineColor: [216, 212, 200] },
    headStyles: { fillColor: PDF_INK, textColor: [255, 255, 255], fontStyle: "bold" },
    footStyles: { fillColor: [239, 237, 231], textColor: [27, 29, 34], fontStyle: "bold" },
    columnStyles: { 1: { halign: "right" } },
  });
  drawBrandedFooter(pdf);
  pdf.save(receiptNo + ".pdf");
  toast("Receipt downloaded.", "good");
}

// separate `barberPay` collection, keyed by the barber's doc id, so they can

}

function openEditPayProfileModal(row) {
  const pay = barberPayProfile(row.name);
  openModal(`
    <div class="modal-head"><h3 class="modal-title">Pay profile · ${escapeHtml(row.name)}</h3><button class="modal-close" id="pp-close">✕</button></div>
    <p style="font-size:12px;color:var(--text-dim);margin:0 0 12px;">Visible only to Payroll. This is kept separate from the Barbers page on purpose.</p>
    <div class="field"><label>Base salary (KSh)</label><input id="pp-base" type="number" step="1" value="${pay.baseSalary || 0}" /></div>
    <div class="field"><label>Commission %</label><input id="pp-comm" type="number" step="1" value="${pay.commissionRate || 0}" /></div>
    <div class="field"><label>Monthly deductions (KSh)</label><input id="pp-ded" type="number" step="1" value="${pay.deductions || 0}" /></div>
    <div id="pp-error"></div>
    <div class="modal-actions"><button class="btn btn-ghost" id="pp-cancel">Cancel</button><button class="btn btn-primary" id="pp-save">Save pay profile</button></div>
  `);
  document.getElementById("pp-close").onclick = closeModal;
  document.getElementById("pp-cancel").onclick = closeModal;
  document.getElementById("pp-save").onclick = async () => {
    const baseSalary = parseFloat(document.getElementById("pp-base").value) || 0;
    const commissionRate = parseFloat(document.getElementById("pp-comm").value) || 0;
    const deductions = parseFloat(document.getElementById("pp-ded").value) || 0;
    const btn = document.getElementById("pp-save");
    btn.disabled = true; btn.textContent = "Saving...";
    try {
      await setDoc(doc(db, "barberPay", row.id), { baseSalary, commissionRate, deductions }, { merge: true });
      await logAudit(`Updated pay profile for ${row.name}`, "High");
      toast("Pay profile saved.", "good");
      closeModal();
    } catch (err) {
      document.getElementById("pp-error").innerHTML = `<div class="auth-error">${escapeHtml(err.message || "Couldn't save that pay profile.")}</div>`;
      btn.disabled = false; btn.textContent = "Save pay profile";
    }
  };
}

  document.getElementById("sp-save").onclick = async () => {
    const staffName = document.getElementById("sp-staff").value;
    const periodType = document.getElementById("sp-period-type").value;
    const periodLabel = document.getElementById("sp-period-label").value.trim() || `${periodType} ending ${todayStr()}`;
    const basicSalary = parseFloat(document.getElementById("sp-basic").value) || 0;
    const allowances = parseFloat(document.getElementById("sp-allow").value) || 0;
    const deductions = parseFloat(document.getElementById("sp-ded").value) || 0;
    const paymentDate = document.getElementById("sp-date").value || todayStr();
    const paymentMethod = document.getElementById("sp-method").value;
    const errEl = document.getElementById("sp-error");
    errEl.innerHTML = "";
    if (!staffName || basicSalary <= 0) { errEl.innerHTML = `<div class="auth-error">Choose a staff member and a basic salary greater than zero.</div>`; return; }
    const netPay = basicSalary + allowances - deductions;
    const refNo = "PS-" + Date.now().toString().slice(-8);
    const btn = document.getElementById("sp-save");
    btn.disabled = true; btn.textContent = "Saving...";
    const payment = { staffName, periodType, periodLabel, basicSalary, allowances, deductions, netPay, paymentDate, paymentMethod, refNo, recordedBy: currentProfile ? currentProfile.name : "—" };
    try {
      const ref = await addDoc(collection(db, "salaryPayments"), payment);
      await logAudit(`Recorded salary payment of ${money(netPay)} for ${staffName}`, "High");
      toast("Salary payment recorded.", "good");

      errEl.innerHTML = `<div class="auth-error">${escapeHtml(err.message || "Couldn't save that payment.")}</div>`;
      btn.disabled = false; btn.textContent = "Record & generate payslip";
    }
  };

/* ============================================================
   REPORTS ENGINE
   ============================================================ */
const DATE_RANGE_PRESETS = ["Today", "Yesterday", "This Week", "Last Week", "This Month", "Last Month", "This Year", "All Time", "Custom"];

function computeRangePreset(key, customStart, customEnd) {
  const fmt = (d) => d.toISOString().slice(0, 10);
  const today = new Date(todayStr() + "T00:00:00");
  const startOfWeek = (d) => { const x = new Date(d); const day = x.getDay(); const diff = day === 0 ? -6 : 1 - day; x.setDate(x.getDate() + diff); return x; };
  switch (key) {
    case "Today": return [fmt(today), fmt(today)];
    case "Yesterday": { const y = new Date(today); y.setDate(y.getDate() - 1); return [fmt(y), fmt(y)]; }
    case "This Week": { const s = startOfWeek(today); return [fmt(s), fmt(today)]; }
    case "Last Week": { const s = startOfWeek(today); s.setDate(s.getDate() - 7); const e = new Date(s); e.setDate(e.getDate() + 6); return [fmt(s), fmt(e)]; }
    case "This Month": { const s = new Date(today.getFullYear(), today.getMonth(), 1); return [fmt(s), fmt(today)]; }
    case "Last Month": { const s = new Date(today.getFullYear(), today.getMonth() - 1, 1); const e = new Date(today.getFullYear(), today.getMonth(), 0); return [fmt(s), fmt(e)]; }
    case "This Year": { const s = new Date(today.getFullYear(), 0, 1); return [fmt(s), fmt(today)]; }
    case "Custom": return (customStart && customEnd) ? [customStart, customEnd] : null;
    case "All Time": default: return null;
  }
}
function inRange(d, range) { if (!range || !d) return !range ? true : false; return d >= range[0] && d <= range[1]; }
function fEq(row, field, val) { if (!val || val === "All") return true; const v = typeof field === "function" ? field(row) : row[field]; return String(v ?? "") === String(val); }
function fIncludes(row, field, val) { if (!val || val === "All") return true; const v = typeof field === "function" ? field(row) : row[field]; return String(v ?? "").includes(String(val)); }

/* ---------- scoped row accessors (apply the shared filter bar to each collection) ---------- */
function scopeSales(ctx) {
  let rows = DATA.sales.filter((s) => !s.voided);
  if (ctx.range) rows = rows.filter((s) => inRange(s.date, ctx.range));
  rows = rows.filter((s) => fEq(s, "branch", ctx.branch) && fEq(s, "barber", ctx.barber) && fEq(s, "customer", ctx.customer)
    && fEq(s, "method", ctx.paymentMethod) && fEq(s, "cashier", ctx.employee));
  if (ctx.service && ctx.service !== "All") rows = rows.filter((s) => (s.items || []).some((it) => it.name === ctx.service));
  return rows;
}
function scopeAppointments(ctx) {
  let rows = DATA.appointments;
  if (ctx.range) rows = rows.filter((a) => inRange(a.date, ctx.range));
  rows = rows.filter((a) => fEq(a, "branch", ctx.branch) && fEq(a, "barber", ctx.barber) && fEq(a, "customer", ctx.customer)
    && fEq(a, "service", ctx.service) && fEq(a, "status", ctx.status) && fEq(a, "source", ctx.employee));
  return rows;
}
function scopeInventory(ctx) {
  let rows = DATA.inventory;
  rows = rows.filter((i) => fEq(i, "branch", ctx.branch) && fEq(i, "supplier", ctx.supplier) && fEq(i, "name", ctx.product));
  return rows;
}
function scopeExpenses(ctx) {
  let rows = DATA.expenses;
  if (ctx.range) rows = rows.filter((e) => inRange(e.date, ctx.range));
  rows = rows.filter((e) => fEq(e, "branch", ctx.branch) && fEq(e, "approvedBy", ctx.employee) && fEq(e, "category", ctx.status));
  return rows;
}
function scopePurchases(ctx) {
  let rows = DATA.purchases;
  if (ctx.range) rows = rows.filter((p) => inRange(p.date, ctx.range));
  rows = rows.filter((p) => fEq(p, "branch", ctx.branch) && fEq(p, "supplier", ctx.supplier) && fEq(p, "item", ctx.product) && fEq(p, "status", ctx.status));
  return rows;
}
function scopeStockMovements(ctx) {
  let rows = DATA.stockMovements;
  if (ctx.range) rows = rows.filter((m) => inRange(m.date, ctx.range));
  rows = rows.filter((m) => fEq(m, "branch", ctx.branch) && fEq(m, "item", ctx.product) && fEq(m, "type", ctx.status));
  return rows;
}
function scopeAttendance(ctx) {
  let rows = DATA.attendance;
  if (ctx.range) rows = rows.filter((a) => inRange(a.date, ctx.range));
  rows = rows.filter((a) => fEq(a, "branch", ctx.branch) && fEq(a, "barber", ctx.barber) && fEq(a, "status", ctx.status));
  return rows;
}
function scopeAudit(ctx) {
  let rows = DATA.audit;
  if (ctx.range) rows = rows.filter((a) => inRange((a.createdAt && a.createdAt.toDate ? a.createdAt.toDate() : new Date(a.ms)).toISOString().slice(0, 10), ctx.range));
  rows = rows.filter((a) => fEq(a, "employee", ctx.employee));
  return rows;
}
function scopeDeposits(ctx) {
  let rows = DATA.deposits;
  if (ctx.range) rows = rows.filter((d) => inRange(d.date, ctx.range));
  rows = rows.filter((d) => fEq(d, "branch", ctx.branch));
  return rows;
}

/* ---------- generic grouping/aggregation ---------- */
function groupRows(rows, keyFn) {
  const map = new Map();
  rows.forEach((r) => { const k = keyFn(r); if (k == null || k === "") return; if (!map.has(k)) map.set(k, []); map.get(k).push(r); });
  return map;
}
function groupReport(rows, keyFn, nameLabel, aggregates, sortKey) {
  const map = groupRows(rows, keyFn);
  const data = [...map.entries()].map(([name, gr]) => {
    const out = { name };
    aggregates.forEach((a) => { out[a.key] = a.fn(gr); });
    return out;
  });
  const columns = [{ key: "name", label: nameLabel }, ...aggregates.map((a) => ({ key: a.key, label: a.label, mono: !!a.mono, align: a.align || "right", render: a.render }))];
  return { columns, rows: data, defaultSort: { key: sortKey || aggregates[0]?.key || "name", dir: "desc" }, searchKeys: ["name"] };
}
const AGG_COUNT = (label) => ({ key: "count", label: label || "Count", fn: (rs) => rs.length });
const AGG_SUM = (field, label) => ({ key: field + "Total", label, mono: true, render: (r) => money(r[field + "Total"]), fn: (rs) => rs.reduce((a, r) => a + (r[field] || 0), 0) });
const AGG_AVG = (field, label) => ({ key: field + "Avg", label, mono: true, render: (r) => money(r[field + "Avg"]), fn: (rs) => rs.length ? Math.round(rs.reduce((a, r) => a + (r[field] || 0), 0) / rs.length) : 0 });
const AGG_UNIQUE = (field, label) => ({ key: field + "Uniq", label, align: "right", fn: (rs) => new Set(rs.map((r) => r[field])).size });

function rowTable(columns, rows, searchKeys, defaultSort) { return { columns, rows, searchKeys: searchKeys || [], defaultSort: defaultSort || { key: columns[0].key, dir: "asc" } }; }

/* ---------- shared filter option lists ---------- */
function optBarbers() { return [...new Set(DATA.barbers.map((b) => b.name))]; }
function optCustomers() { return [...new Set(DATA.customers.map((c) => c.name))]; }

function optEmployees() { return [...new Set([...DATA.barbers.map((b) => b.name), ...DATA.sales.map((s) => s.cashier)].filter(Boolean))]; }

      return rowTable([{ key: "name", label: "Line item" }, { key: "total", label: "Amount", mono: true, align: "right", render: (r) => money(r.total) }], data, [], { key: "name", dir: "asc" }); } },

      const rows = scopeExpenses(ctx);
      return groupReport(rows, (e) => e.category || "Other", "Category", [AGG_SUM("amount", "Total")]); } },
  { id: "gross-profit", label: "Gross Profit Report", filters: ["dateRange", "branch"], run: (ctx) => {

        [{ name: "Revenue", total: sales }, { name: "Cost of goods", total: purchases }, { name: "Gross profit", total: sales - purchases }], [], { key: "name", dir: "asc" }); } },
  { id: "net-profit", label: "Net Profit Report", filters: ["dateRange", "branch"], run: (ctx) => {
      const sales = scopeSales(ctx).reduce((a, s) => a + (s.amount || 0), 0);
      const expenses = scopeExpenses(ctx).reduce((a, e) => a + (e.amount || 0), 0);
      const purchases = scopePurchases(ctx).reduce((a, p) => a + (p.total || 0), 0);
      return rowTable([{ key: "name", label: "Line item" }, { key: "total", label: "Amount", mono: true, align: "right", render: (r) => money(r.total) }],
        [{ name: "Net profit", total: sales - expenses - purchases }], [], { key: "name", dir: "asc" }); } },
  { id: "cash-flow", label: "Cash Flow Report", filters: ["dateRange", "branch"], run: (ctx) => {

/* ---------- shared helpers ---------- */
function cellPlainText(col, r) {
  if (col.csv) return col.csv(r);
  const raw = col.render ? col.render(r) : (r[col.key] ?? "");
  return String(raw).replace(/<[^>]+>/g, "").trim();
}
function htmlEsc(v) { return String(v ?? "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m])); }

/* ============================================================
   BRANDED PDF ENGINE
   Every downloadable document in the app (reports, service receipts,
   payslips) shares this one letterhead + footer so they all look like
   they came from the same premium, on-brand system.
   ============================================================ */
const PDF_INK = [21, 23, 28], PDF_RED = [178, 58, 52], PDF_BLUE = [46, 71, 99], PDF_GOLD = [169, 120, 47], PDF_TEXTDIM = [107, 106, 99];

function newBrandedDoc() {
  if (!window.jspdf) { toast("PDF library is still loading — try again in a moment.", "bad"); return null; }
  const { jsPDF } = window.jspdf;
  return new jsPDF({ unit: "pt", format: "a4" });
}
// Draws the shop logo / name / document title + a strip of key identifiers.
// Returns the Y coordinate the caller should start drawing content at.
function drawBrandedHeader(pdf, title, identifiers) {
  const pageWidth = pdf.internal.pageSize.getWidth();
  pdf.setFillColor(...PDF_INK); pdf.rect(0, 0, pageWidth, 78, "F");
  pdf.setFillColor(...PDF_RED); pdf.rect(0, 78, pageWidth * 0.42, 4, "F");
  pdf.setFillColor(255, 255, 255); pdf.rect(pageWidth * 0.42, 78, pageWidth * 0.18, 4, "F");
  pdf.setFillColor(...PDF_BLUE); pdf.rect(pageWidth * 0.6, 78, pageWidth * 0.4, 4, "F");

  let textX = 40;
  if (SHOP_SETTINGS.logo) {
    try {
      const fmt = SHOP_SETTINGS.logo.includes("image/png") ? "PNG" : "JPEG";
      pdf.addImage(SHOP_SETTINGS.logo, fmt, 40, 16, 44, 44, undefined, "FAST");
      textX = 96;
    } catch (e) { /* logo failed to decode — fall back to text only */ }
  }
  pdf.setTextColor(255, 255, 255);
  pdf.setFont("helvetica", "bold"); pdf.setFontSize(16);
  pdf.text(SHOP_SETTINGS.name || "Barbershop", textX, 34);
  pdf.setFont("helvetica", "normal"); pdf.setFontSize(9.5); pdf.setTextColor(200, 199, 205);
  const locLine = [SHOP_SETTINGS.location, SHOP_SETTINGS.phone].filter(Boolean).join("  ·  ");
  if (locLine) pdf.text(locLine, textX, 48);

  pdf.setFont("helvetica", "bold"); pdf.setFontSize(15); pdf.setTextColor(255, 255, 255);
  pdf.text(title, pageWidth - 40, 34, { align: "right" });
  pdf.setFont("helvetica", "normal"); pdf.setFontSize(9); pdf.setTextColor(200, 199, 205);
  pdf.text("Generated " + new Date().toLocaleString("en-KE"), pageWidth - 40, 48, { align: "right" });

  let y = 100;
  if (identifiers && identifiers.length) {
    pdf.setDrawColor(216, 212, 200); pdf.setFillColor(251, 250, 247);
    const rowH = 30;
    pdf.rect(40, y - 18, pageWidth - 80, rowH, "F");
    const colW = (pageWidth - 80) / identifiers.length;
    identifiers.forEach((id, i) => {
      const x = 50 + i * colW;
      pdf.setFont("helvetica", "bold"); pdf.setFontSize(7); pdf.setTextColor(...PDF_TEXTDIM);
      pdf.text(String(id.label).toUpperCase(), x, y - 6);
      pdf.setFont("helvetica", "normal"); pdf.setFontSize(9.5); pdf.setTextColor(27, 29, 34);
      pdf.text(String(id.value || "—"), x, y + 6);
    });
    y += rowH + 6;
  }
  return y;
}
// Stamps "Powered by Omlin" + page numbers on every page. Call once, right before saving.
function drawBrandedFooter(pdf) {
  const pageCount = pdf.internal.getNumberOfPages();
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  for (let i = 1; i <= pageCount; i++) {
    pdf.setPage(i);
    pdf.setDrawColor(216, 212, 200); pdf.line(40, pageHeight - 34, pageWidth - 40, pageHeight - 34);
    pdf.setFont("helvetica", "normal"); pdf.setFontSize(8.5); pdf.setTextColor(...PDF_TEXTDIM);
    pdf.text("Powered by Omlin", 40, pageHeight - 20);
    pdf.text(`Page ${i} of ${pageCount}`, pageWidth - 40, pageHeight - 20, { align: "right" });
  }
}
function downloadReportPDF(title, identifiers, columns, rows, filename) {
  const pdf = newBrandedDoc(); if (!pdf) return;
  const startY = drawBrandedHeader(pdf, title, identifiers);
  pdf.autoTable({
    startY,
    head: [columns.map((c) => c.label)],
    body: rows.map((r) => columns.map((c) => cellPlainText(c, r))),
    margin: { left: 40, right: 40, bottom: 44 },
    styles: { font: "helvetica", fontSize: 8.5, cellPadding: 5, textColor: [27, 29, 34], lineColor: [216, 212, 200] },
    headStyles: { fillColor: PDF_INK, textColor: [255, 255, 255], fontStyle: "bold" },
    alternateRowStyles: { fillColor: [239, 237, 231] },
  });
  drawBrandedFooter(pdf);
  pdf.save(filename + ".pdf");
  toast("PDF downloaded.", "good");
}

/* ---------- filter bar ---------- */
const FILTER_DEFS = {
  dateRange: { label: "Date range" },
  branch: { label: "Branch", options: () => BRANCHES },
  barber: { label: "Barber", options: optBarbers },
  customer: { label: "Customer", options: optCustomers },
  service: { label: "Service", options: optServices },
  product: { label: "Product", options: optProducts },
  supplier: { label: "Supplier", options: optSuppliers },
  paymentMethod: { label: "Payment method", options: () => optPaymentMethods },
  employee: { label: "Employee", options: optEmployees },
  status: { label: "Status", options: () => optApptStatus },
};
function renderFilterBar(container, report, ctx, onChange) {
  const keys = report.filters || [];
  container.innerHTML = keys.map((k) => {
    if (k === "dateRange") {
      return `<select class="filter-select" data-fk="dateRange">
          ${DATE_RANGE_PRESETS.map((p) => `<option value="${p}" ${ctx.__preset === p ? "selected" : ""}>${p}</option>`).join("")}
        </select>
        <input type="date" class="filter-select rf-custom-start ${ctx.__preset === "Custom" ? "" : "hidden"}" value="${ctx.__customStart || ""}" />
        <input type="date" class="filter-select rf-custom-end ${ctx.__preset === "Custom" ? "" : "hidden"}" value="${ctx.__customEnd || ""}" />`;
    }
    const def = FILTER_DEFS[k];
    const opts = k === "status" ? (report.statusOptions || optApptStatus) : def.options();
    return `<select class="filter-select" data-fk="${k}">
        <option value="All">${htmlEsc(def.label)}: All</option>
        ${opts.map((o) => `<option value="${htmlEsc(o)}" ${ctx[k] === o ? "selected" : ""}>${htmlEsc(o)}</option>`).join("")}
      </select>`;
  }).join("");
  container.querySelectorAll("select[data-fk], input.rf-custom-start, input.rf-custom-end").forEach((el) => {
    el.addEventListener("change", () => {
      if (el.dataset.fk === "dateRange") {
        ctx.__preset = el.value;
        container.querySelectorAll(".rf-custom-start, .rf-custom-end").forEach((d) => d.classList.toggle("hidden", el.value !== "Custom"));
        ctx.range = computeRangePreset(el.value, ctx.__customStart, ctx.__customEnd);
      } else if (el.classList.contains("rf-custom-start")) { ctx.__customStart = el.value; if (ctx.__preset === "Custom") ctx.range = computeRangePreset("Custom", ctx.__customStart, ctx.__customEnd); }
      else if (el.classList.contains("rf-custom-end")) { ctx.__customEnd = el.value; if (ctx.__preset === "Custom") ctx.range = computeRangePreset("Custom", ctx.__customStart, ctx.__customEnd); }
      else { ctx[el.dataset.fk] = el.value; }
      onChange();
    });
  });
}

      { key: "role", label: "Role", options: ALL_ROLES },
    ],

      const activeBtn = r.active === false
        ? `<button class="btn btn-sm btn-ok" data-act="activate" data-uid="${r.uid}">Activate</button>`
        : `<button class="btn btn-sm btn-danger" data-act="deactivate" data-uid="${r.uid}" ${isSelf ? "disabled title=\"You can't deactivate yourself\"" : ""}>Deactivate</button>`;
      return `${activeBtn}
        <button class="btn btn-sm btn-ghost" data-act="reset" data-uid="${r.uid}" data-email="${escapeHtml(r.email)}">Reset password</button>
        <button class="btn btn-sm btn-ghost" data-act="role" data-uid="${r.uid}" data-role="${r.role}">Edit role</button>
        ${isAdmin(r) ? "" : `<button class="btn btn-sm btn-ghost" data-act="access" data-uid="${r.uid}">Module access</button>`}`;
    },
    onMount: (container) => {
      container.addEventListener("click", async (e) => {
        const btn = e.target.closest("button[data-act]");
        if (!btn) return;
        const act = btn.dataset.act, uid = btn.dataset.uid;
        if (act === "deactivate") {
          if (!confirm("Deactivate this account? They won't be able to sign in until reactivated.")) return;
          await updateDoc(doc(db, "users", uid), { active: false });
          toast("Account deactivated.", "good");
        } else if (act === "activate") {
          await updateDoc(doc(db, "users", uid), { active: true });
          toast("Account reactivated.", "good");
        } else if (act === "reset") {
          try { await sendPasswordResetEmail(auth, btn.dataset.email); toast(`Password reset link sent to ${btn.dataset.email}.`, "good"); }
          catch (err) { toast(friendlyAuthError(err), "bad"); }
        } else if (act === "role") {
          openEditRoleModal(uid, btn.dataset.role);
        } else if (act === "access") {
          const row = staffDocs.find((s) => s.uid === uid);
          openEditAccessModal(uid, row ? row.moduleAccess : null);
        }
      });
    },
  });
}

function subscribeStaff() {
  if (staffUnsub) staffUnsub();
  staffUnsub = onSnapshot(collection(db, "users"), (snap) => {
    staffDocs = snap.docs.map((d) => ({ uid: d.id, ...d.data() }));
    const staffTable = document.getElementById("staff-table");
    if (staffTable) mountStaffRefresh();
  });
}
function mountStaffRefresh() {
  // cheap re-mount keeps this simple and correct after live Firestore updates
  const root = document.getElementById("page-wrap");
  if (currentPage === "staff") renderStaff(root);
}

  for (let i = 0; i < 10; i++) out += chars[Math.floor(Math.random() * chars.length)];

}

// Checking Write auto-checks Read (write implies read); unchecking Read clears Write.
function wireAccessCheckboxes(container) {
  container.querySelectorAll(".am-write").forEach((cb) => cb.addEventListener("change", () => {
    if (cb.checked) container.querySelector(`.am-read[data-mod="${cb.dataset.mod}"]`).checked = true;
  }));
  container.querySelectorAll(".am-read").forEach((cb) => cb.addEventListener("change", () => {
    if (!cb.checked) container.querySelector(`.am-write[data-mod="${cb.dataset.mod}"]`).checked = false;
  }));
}

function fileToResizedDataUrl(file, maxSize) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Couldn't read that file."));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("That doesn't look like a valid image."));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxSize || height > maxSize) {
          const scale = maxSize / Math.max(width, height);
          width = Math.round(width * scale); height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function batchInsert(collectionName, records) {
  for (let i = 0; i < records.length; i += 400) {
    const batch = writeBatch(db);
    records.slice(i, i + 400).forEach((rec) => { const ref = doc(collection(db, collectionName)); batch.set(ref, rec); });
    await batch.commit();
  }
}
// Writes each barber's public profile to `barbers` and their sensitive pay
// figures (commissionRate/baseSalary/deductions) to a separate `barberPay`
// doc that shares the same ID — kept apart so payroll-only access can be
// granted without also exposing it to everyone who can see the Barbers page.
async function seedBarbersWithPay(barberSeed) {
  const batch = writeBatch(db);
  const barberDocs = [];
  barberSeed.forEach((b) => {
    const ref = doc(collection(db, "barbers"));
    batch.set(ref, b);
    batch.set(doc(db, "barberPay", ref.id), { commissionRate: rInt(25, 35), baseSalary: rInt(14000, 22000), deductions: rInt(500, 1800) });
    barberDocs.push({ id: ref.id, ...b });
  });
  await batch.commit();
  return barberDocs;
}
async function clearAllBusinessData() {
  const names = ["barbers", "services", "customers", "inventory", "suppliers", "expenses", "appointments", "sales", "purchases", "stockMovements", "attendance", "promotions", "deposits", "salaryPayments", "barberPay"];
  for (const name of names) {
    const snap = await getDocs(collection(db, name));
    const docs = snap.docs;
    for (let i = 0; i < docs.length; i += 400) {
      const batch = writeBatch(db);
      docs.slice(i, i + 400).forEach((d) => batch.delete(d.ref));
      await batch.commit();
    }
  }
}

function rInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function rPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function rBool(prob) { return Math.random() < prob; }
function daysAgoStr(n) { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); }
function daysFromNowStr(n) { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
function rTime() { return `${String(rInt(8, 19)).padStart(2, "0")}:${rPick(["00", "15", "30", "45"])}`; }
