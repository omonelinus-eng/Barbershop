const fbApp = initializeApp(firebaseConfig);

const db = getFirestore(fbApp);

// Updated by Root whenever the signed-in profile loads/changes; used to label audit entries.
let CURRENT_USER_LABEL = "Someone";

async function checkAdminExists() {
  const snap = await getDoc(doc(db, "meta", "setup"));
  return snap.exists() && snap.data().adminCreated === true;
}

async function createAdminAccount({ email, password, businessName, displayName }) {
  const cred = await createUserWithEmailAndPassword(auth, email, password);
  const uid = cred.user.uid;
  await setDoc(doc(db, "users", uid), {
    role: "admin", email, username: "admin", displayName: displayName || "Owner",
    active: true, createdAt: serverTimestamp(),
  });
  await setDoc(doc(db, "meta", "setup"), {
    adminCreated: true, businessName: businessName || "Fikirini's", createdAt: serverTimestamp(),
  });
  return uid;
}

async function loginWithEmail(email, password) {
  const cred = await signInWithEmailAndPassword(auth, email, password);
  return cred.user;
}

async function logout() {
  await signOut(auth);
}

// Creates a staff auth account + Firestore profile WITHOUT signing the admin out,
// by using a throwaway secondary Firebase app instance.
async function createStaffAccount({ email, password, username, displayName }) {
  const secondaryApp = initializeApp(firebaseConfig, "Secondary-" + Date.now());
  const secondaryAuth = getAuth(secondaryApp);
  try {
    const cred = await createUserWithEmailAndPassword(secondaryAuth, email, password);
    const uid = cred.user.uid;
    await setDoc(doc(db, "users", uid), {
      role: "staff", username, displayName, email,
      active: true, createdAt: serverTimestamp(),
    });
    await signOut(secondaryAuth);
    return uid;
  } finally {
    await deleteApp(secondaryApp);
  }
}

async function setStaffActive(uid, active) {
  await updateDoc(doc(db, "users", uid), { active });
}

async function sendReset(email) {
  await sendPasswordResetEmail(auth, email);
}

function genPassword() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%";
  let out = "";
  for (let i = 0; i < 10; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return out;
}

async function logAudit(action, severity = "Low") {
  try {
    const ref = doc(collection(db, "auditLog"));
    await setDoc(ref, {
      time: new Date().toLocaleString("en-KE", { hour12: false }),
      user: CURRENT_USER_LABEL, action, severity, sample: false, createdAt: serverTimestamp(),
    });
  } catch (e) { /* non-fatal — never block the user's action on a logging failure */ }
}

};
const DATA_COLLECTIONS = Object.keys(SAMPLE_COLLECTIONS);

async function loadSampleData() {
  const batch = writeBatch(db);
  Object.entries(SAMPLE_COLLECTIONS).forEach(([coll, rows]) => {
    rows.forEach((row) => {
      const ref = doc(collection(db, coll));
      batch.set(ref, { ...row, sample: true, createdAt: serverTimestamp() });
    });
  });
  await batch.commit();
}

async function clearSampleData() {
  for (const coll of DATA_COLLECTIONS) {
    const q = query(collection(db, coll), where("sample", "==", true));
    const snap = await getDocs(q);
    if (snap.docs.length === 0) continue;
    const batch = writeBatch(db);
    snap.docs.forEach((d) => batch.delete(d.ref));
    await batch.commit();
  }
}

async function getCollectionCounts() {
  const counts = {};
  for (const coll of DATA_COLLECTIONS) {
    const snap = await getDocs(collection(db, coll));
    let sample = 0, real = 0;
    snap.docs.forEach((d) => (d.data().sample ? sample++ : real++));
    counts[coll] = { sample, real, total: snap.docs.length };
  }
  return counts;
}

// Live-subscribes to a Firestore collection for use in a page component.
function useCollectionData(name) {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    setLoading(true);
    const unsub = onSnapshot(collection(db, name), (snap) => {
      setRows(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
      setLoading(false);
    }, () => setLoading(false));
    return () => unsub();
  }, [name]);
  return [rows, loading];
}

/* ---------------------------------- DATA TABLE (filters + sorting everywhere) ---------------------------------- */
function DataTable({ columns, rows, searchKeys, filters = [], defaultSort }) {
  const [search, setSearch] = useState("");
  const [filterState, setFilterState] = useState({});
  const [sort, setSort] = useState(defaultSort || { key: columns[0].key, dir: "asc" });

  const filtered = useMemo(() => {
    let out = rows;
    if (search.trim()) {
      const q = search.toLowerCase();
      out = out.filter((r) => searchKeys.some((k) => String(r[k] ?? "").toLowerCase().includes(q)));
    }
    Object.entries(filterState).forEach(([key, val]) => {
      if (val && val !== "All") out = out.filter((r) => String(r[key]) === val);
    });
    return out;
  }, [rows, search, filterState, searchKeys]);

  const sorted = useMemo(() => {
    const arr = [...filtered];
    arr.sort((a, b) => {
      const av = a[sort.key], bv = b[sort.key];
      const an = parseFloat(String(av).replace(/[^0-9.-]/g, ""));
      const bn = parseFloat(String(bv).replace(/[^0-9.-]/g, ""));
      let cmp;
      if (!isNaN(an) && !isNaN(bn) && String(av).match(/[0-9]/)) cmp = an - bn;
      else cmp = String(av ?? "").localeCompare(String(bv ?? ""));
      return sort.dir === "asc" ? cmp : -cmp;
    });
    return arr;
  }, [filtered, sort]);

  const toggleSort = (key) => {
    setSort((s) => (s.key === key ? { key, dir: s.dir === "asc" ? "desc" : "asc" } : { key, dir: "asc" }));
  };

  return (
    <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: "10px", overflow: "hidden" }}>
      {/* controls */}
      <div style={{ display: "flex", gap: "10px", alignItems: "center", padding: "14px 16px", borderBottom: `1px solid ${C.line}`, flexWrap: "wrap" }}>
        <div style={{ position: "relative", flex: "1 1 200px", minWidth: "180px" }}>
          <Search size={14} color={C.textDim} style={{ position: "absolute", left: "10px", top: "50%", transform: "translateY(-50%)" }} />
          <input
            value={search}
            onChange={(e) => setSearch(e.target.value)}
            placeholder="Search..."
            style={{
              width: "100%", fontFamily: FONT_BODY, fontSize: "13px", padding: "8px 10px 8px 30px",
              border: `1px solid ${C.line}`, borderRadius: "7px", background: C.paper, color: C.text, outline: "none", boxSizing: "border-box",
            }}
          />
        </div>
        {filters.map((f) => (
          <select
            key={f.key}
            value={filterState[f.key] || "All"}
            onChange={(e) => setFilterState((s) => ({ ...s, [f.key]: e.target.value }))}
            style={{
              fontFamily: FONT_BODY, fontSize: "12.5px", padding: "8px 10px", border: `1px solid ${C.line}`,
              borderRadius: "7px", background: C.paper, color: C.text, outline: "none", cursor: "pointer",
            }}
          >
            <option value="All">{f.label}: All</option>
            {f.options.map((o) => <option key={o} value={o}>{o}</option>)}
          </select>
        ))}
        <span style={{ fontFamily: FONT_MONO, fontSize: "11.5px", color: C.textDim, marginLeft: "auto" }}>{sorted.length} of {rows.length}</span>
      </div>

      {/* table */}
      <div style={{ overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", minWidth: "640px" }}>
          <thead>
            <tr>
              {columns.map((col) => (
                <th
                  key={col.key}
                  onClick={() => toggleSort(col.key)}
                  style={{
                    textAlign: col.align || "left", padding: "10px 16px", cursor: "pointer", userSelect: "none",
                    fontFamily: FONT_BODY, fontSize: "11px", fontWeight: 700, color: C.textDim, letterSpacing: "0.5px",
                    textTransform: "uppercase", borderBottom: `1px solid ${C.line}`, whiteSpace: "nowrap", background: C.paperDim,
                  }}
                >
                  <span style={{ display: "inline-flex", alignItems: "center", gap: "4px", justifyContent: col.align === "right" ? "flex-end" : "flex-start" }}>
                    {col.label}
                    {sort.key === col.key ? (sort.dir === "asc" ? <ArrowUp size={11} /> : <ArrowDown size={11} />) : <ArrowUpDown size={11} opacity={0.35} />}
                  </span>
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {sorted.map((row, i) => (
              <tr key={row.id || i} style={{ borderBottom: `1px solid ${C.line}` }}>
                {columns.map((col) => (
                  <td key={col.key} style={{
                    padding: "11px 16px", fontFamily: col.mono ? FONT_MONO : FONT_BODY, fontSize: "13px",
                    color: C.text, textAlign: col.align || "left", whiteSpace: "nowrap",
                  }}>
                    {col.render ? col.render(row) : row[col.key]}
                  </td>
                ))}
              </tr>
            ))}
            {sorted.length === 0 && (
              <tr><td colSpan={columns.length} style={{ padding: "28px", textAlign: "center", fontFamily: FONT_BODY, color: C.textDim, fontSize: "13px" }}>
                Nothing matches this filter. Adjust the search or filters above.
              </td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function AddRecordModal({ collectionName, onClose }) {
  const config = ENTITY_CONFIGS[collectionName];
  const initial = {};
  config.fields.forEach((f) => { initial[f.key] = f.type === "select" ? f.options[0] : ""; });
  const [values, setValues] = useState(initial);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  const setVal = (k, v) => setValues((s) => ({ ...s, [k]: v }));

  const submit = async (e) => {
    e.preventDefault();
    setBusy(true); setError("");
    try {
      const payload = { ...config.defaults };
      config.fields.forEach((f) => {
        let v = values[f.key];
        if (f.type === "number") v = v === "" ? 0 : parseFloat(v);
        payload[f.key] = v;
      });
      payload.sample = false;
      payload.createdAt = serverTimestamp();
      const ref = doc(collection(db, collectionName));
      await setDoc(ref, payload);
      const label = payload.name || payload.desc || payload.customer || "record";
      await logAudit(`Added ${collectionName.slice(0, -1)}: ${label}`, "Low");
      onClose(true);
    } catch (err) {
      setError(err && err.message ? err.message : "Something went wrong. Please try again.");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(21,23,28,0.55)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: "16px" }}>
      <div style={{ background: C.card, borderRadius: "12px", padding: "24px", width: "100%", maxWidth: "420px", border: `1px solid ${C.line}`, maxHeight: "90vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "16px" }}>
          <div style={{ fontFamily: FONT_DISPLAY, fontSize: "17px", fontWeight: 600, color: C.text }}>{config.title}</div>
          <button onClick={() => onClose(false)} style={{ background: "none", border: "none", cursor: "pointer", display: "flex" }}><X size={18} color={C.textDim} /></button>
        </div>
        <ErrorNote message={error} />
        <form onSubmit={submit}>
          {config.fields.map((f) => (
            f.type === "select" ? (
              <div key={f.key} style={{ marginBottom: "14px" }}>
                <label style={{ display: "block", fontSize: "11.5px", fontWeight: 600, color: C.textDim, marginBottom: "6px", textTransform: "uppercase", letterSpacing: "0.4px" }}>{f.label}</label>
                <select value={values[f.key]} onChange={(e) => setVal(f.key, e.target.value)} style={{ width: "100%", fontFamily: FONT_BODY, fontSize: "13.5px", padding: "10px 12px", border: `1px solid ${C.line}`, borderRadius: "8px", background: C.paper, color: C.text, outline: "none" }}>
                  {f.options.map((o) => <option key={o} value={o}>{o}</option>)}
                </select>
              </div>
            ) : (
              <Field key={f.key} label={f.label} type={f.type === "number" ? "number" : "text"} value={values[f.key]} onChange={(e) => setVal(f.key, e.target.value)} />
            )
          ))}
          <PrimaryButton type="submit" disabled={busy}>
            {busy ? <Loader2 size={15} className="spin" /> : <Plus size={15} />} Save
          </PrimaryButton>
        </form>
      </div>
    </div>
  );
}

function POSPage({ profile }) {
  const [services, servicesLoading] = useCollectionData("services");
  const [sales, salesLoading] = useCollectionData("sales");
  const [barbers] = useCollectionData("barbers");
  const [cart, setCart] = useState([]);
  const [barber, setBarber] = useState("");
  const [method, setMethod] = useState("Cash");
  const [customer, setCustomer] = useState("Walk-in");
  const [charging, setCharging] = useState(false);
  const total = cart.reduce((a, c) => a + (c.price || 0), 0);

  const columns = [
    { key: "date", label: "Date", mono: true },
    { key: "time", label: "Time", mono: true },
    { key: "customer", label: "Customer" },
    { key: "barber", label: "Barber" },
    { key: "items", label: "Items" },
    { key: "method", label: "Payment", render: (r) => <Pill tone="info">{r.method}</Pill> },
    { key: "amount", label: "Amount", mono: true, align: "right", render: (r) => money(r.amount) },
  ];

  const charge = async () => {
    if (cart.length === 0) return;
    setCharging(true);
    try {
      const now = new Date();
      const ref = doc(collection(db, "sales"));
      await setDoc(ref, {
        date: now.toISOString().slice(0, 10),
        time: now.toTimeString().slice(0, 5),
        customer: customer || "Walk-in",
        barber: barber || "Unassigned",
        items: cart.map((c) => c.name).join(", "),
        amount: total,
        method,
        cashier: profile?.displayName || profile?.username || "Staff",
        sample: false,
        createdAt: serverTimestamp(),
      });
      await logAudit(`Recorded sale of ${money(total)} (${method})`, "Low");
      setCart([]);
      setCustomer("Walk-in");
    } finally {
      setCharging(false);
    }
  };

  return (
    <div>
      <SectionHeader eyebrow="Point of sale" title="Sales & checkout" />
      <div style={{ display: "flex", gap: "16px", flexWrap: "wrap", marginBottom: "20px" }}>
        <div style={{ flex: "1 1 320px", background: C.card, border: `1px solid ${C.line}`, borderRadius: "10px", padding: "16px" }}>
          <span style={{ fontFamily: FONT_DISPLAY, fontSize: "16px", fontWeight: 600 }}>New sale</span>
          {servicesLoading ? <div style={{ marginTop: "12px" }}><LoadingBlock label="Loading services…" /></div> : services.filter((s) => s.status === "Active").length === 0 ? (
            <div style={{ marginTop: "12px", fontSize: "12.5px", color: C.textDim }}>No active services yet — add some on the Services page.</div>
          ) : (
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px", marginTop: "12px" }}>
              {services.filter((s) => s.status === "Active").map((s) => (
                <button key={s.id} onClick={() => setCart((c) => [...c, s])}
                  style={{
                    textAlign: "left", padding: "9px 10px", border: `1px solid ${C.line}`, borderRadius: "7px",
                    background: C.paper, cursor: "pointer", fontFamily: FONT_BODY,
                  }}>
                  <div style={{ fontSize: "12.5px", color: C.text, fontWeight: 500 }}>{s.name}</div>
                  <div style={{ fontSize: "11.5px", color: C.textDim, fontFamily: FONT_MONO }}>{money(s.price)}</div>
                </button>
              ))}
            </div>
          )}
        </div>

        <div style={{ flex: "1 1 260px", background: C.ink, borderRadius: "10px", padding: "18px", color: C.white, position: "relative", overflow: "hidden" }}>
          <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: "5px", background: `repeating-linear-gradient(90deg, ${C.red} 0 14px, ${C.white} 14px 20px, ${C.blue} 20px 34px)` }} />
          <span style={{ fontFamily: FONT_DISPLAY, fontSize: "16px", fontWeight: 600 }}>Current ticket</span>

          <div style={{ display: "flex", flexDirection: "column", gap: "8px", marginTop: "12px" }}>
            <input value={customer} onChange={(e) => setCustomer(e.target.value)} placeholder="Customer name" style={{ fontFamily: FONT_BODY, fontSize: "12.5px", padding: "7px 9px", borderRadius: "6px", border: "1px solid #333", background: "#1F222A", color: C.white, outline: "none" }} />
            <select value={barber} onChange={(e) => setBarber(e.target.value)} style={{ fontFamily: FONT_BODY, fontSize: "12.5px", padding: "7px 9px", borderRadius: "6px", border: "1px solid #333", background: "#1F222A", color: C.white, outline: "none" }}>
              <option value="">Select barber…</option>
              {barbers.map((b) => <option key={b.id} value={b.name}>{b.name}</option>)}
            </select>
            <select value={method} onChange={(e) => setMethod(e.target.value)} style={{ fontFamily: FONT_BODY, fontSize: "12.5px", padding: "7px 9px", borderRadius: "6px", border: "1px solid #333", background: "#1F222A", color: C.white, outline: "none" }}>
              {["Cash", "M-Pesa", "Card", "Mixed"].map((m) => <option key={m} value={m}>{m}</option>)}
            </select>
          </div>

          <div style={{ marginTop: "12px", display: "flex", flexDirection: "column", gap: "6px", minHeight: "40px" }}>
            {cart.length === 0 && <div style={{ fontFamily: FONT_BODY, fontSize: "12.5px", color: "#9A9CA6", opacity: 0.6 }}>Tap a service to add it to the ticket.</div>}
            {cart.map((c, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", fontFamily: FONT_MONO, fontSize: "12.5px" }}>
                <span>{c.name}</span><span>{money(c.price)}</span>
              </div>
            ))}
          </div>
          <div style={{ borderTop: "1px solid #333", marginTop: "12px", paddingTop: "12px", display: "flex", justifyContent: "space-between", fontFamily: FONT_MONO, fontSize: "18px", fontWeight: 600 }}>
            <span>Total</span><span>{money(total)}</span>
          </div>
          <button onClick={charge} disabled={cart.length === 0 || charging} style={{
            marginTop: "14px", width: "100%", padding: "10px", borderRadius: "7px", border: "none",
            background: cart.length === 0 || charging ? C.textDim : C.red, color: C.white, fontFamily: FONT_BODY,
            fontWeight: 600, fontSize: "13px", cursor: cart.length === 0 || charging ? "default" : "pointer",
            display: "flex", alignItems: "center", justifyContent: "center", gap: "8px",
          }}>{charging ? <Loader2 size={14} className="spin" /> : null} Charge {money(total)}</button>
        </div>
      </div>

      <div style={{ fontFamily: FONT_BODY, fontSize: "13px", fontWeight: 600, color: C.text, marginBottom: "10px" }}>Recent transactions</div>
      {salesLoading ? <LoadingBlock /> : sales.length === 0 ? <EmptyState label="No sales recorded yet." isAdmin={true} /> : (
        <DataTable
          columns={columns}
          rows={sales}
          searchKeys={["customer", "barber", "items"]}
          filters={[
            { key: "method", label: "Payment", options: ["Cash", "M-Pesa", "Card", "Mixed"] },
          ]}
          defaultSort={{ key: "date", dir: "desc" }}
        />
      )}
    </div>
  );
}

function SettingsPage() {
  const [counts, setCounts] = useState(null);
  const [loadingCounts, setLoadingCounts] = useState(true);
  const [busy, setBusy] = useState(false);
  const [confirmText, setConfirmText] = useState("");
  const [note, setNote] = useState("");
  const [businessName, setBusinessName] = useState("");
  const [savingName, setSavingName] = useState(false);

  const refreshCounts = async () => {
    setLoadingCounts(true);
    try {
      setCounts(await getCollectionCounts());
    } finally {
      setLoadingCounts(false);
    }
  };

  useEffect(() => {
    refreshCounts();
    getDoc(doc(db, "meta", "setup")).then((snap) => {
      if (snap.exists()) setBusinessName(snap.data().businessName || "");
    });
  }, []);

  const totalSample = counts ? Object.values(counts).reduce((a, c) => a + c.sample, 0) : 0;

  const doLoadSample = async () => {
    setBusy(true); setNote("");
    try {
      await loadSampleData();
      await logAudit("Loaded sample/demo data", "Medium");
      setNote("Sample data loaded across all sections.");
      await refreshCounts();
    } catch (e) {
      setNote(e.message || "Something went wrong.");
    } finally {
      setBusy(false);
    }
  };

  const doClearSample = async () => {
    setBusy(true); setNote("");
    try {
      await clearSampleData();
      await logAudit("Cleared sample/demo data", "High");
      setNote("Sample data cleared. Anything you or your staff entered was left untouched.");
      setConfirmText("");
      await refreshCounts();
    } catch (e) {
      setNote(e.message || "Something went wrong.");
    } finally {
      setBusy(false);
    }
  };

  const saveBusinessName = async () => {

        </div>
      </div>

      <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: "10px", padding: "20px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: "6px" }}>

        {note && <div style={{ background: "#DEE5EC", color: C.blue, borderRadius: "8px", padding: "10px 14px", fontSize: "12.5px", marginBottom: "14px" }}>{note}</div>}

        {loadingCounts || !counts ? (
          <div style={{ fontSize: "12.5px", color: C.textDim, marginBottom: "14px" }}>Checking your data…</div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(140px,1fr))", gap: "8px", marginBottom: "16px" }}>

        <button onClick={doLoadSample} disabled={busy} style={{ display: "flex", alignItems: "center", gap: "6px", padding: "10px 16px", borderRadius: "8px", border: "none", background: C.blue, color: C.white, fontFamily: FONT_BODY, fontWeight: 600, fontSize: "12.5px", cursor: busy ? "default" : "pointer" }}>

            <AlertTriangle size={14} /> DANGER ZONE
          </div>
          <div style={{ fontSize: "12.5px", color: C.textDim, marginBottom: "10px" }}>
            This permanently deletes only the {totalSample} sample record{totalSample === 1 ? "" : "s"} currently loaded — real records are never touched. Type <b>CLEAR</b> to enable the button.
          </div>
          <div style={{ display: "flex", gap: "10px", flexWrap: "wrap" }}>
            <input value={confirmText} onChange={(e) => setConfirmText(e.target.value)} placeholder="Type CLEAR" style={{ fontFamily: FONT_MONO, fontSize: "13px", padding: "9px 12px", border: `1px solid ${C.line}`, borderRadius: "8px", background: C.paper, color: C.text, outline: "none", width: "160px" }} />

                cursor: (busy || confirmText !== "CLEAR" || totalSample === 0) ? "default" : "pointer",
              }}>
              <AlertTriangle size={14} /> Clear sample data
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function PrimaryButton({ children, onClick, disabled, type = "button" }) {

function ErrorNote({ message }) {
  if (!message) return null;
  return (
    <div style={{
      display: "flex", gap: "8px", alignItems: "flex-start", background: "#F3DEDB", color: C.redDeep,
      borderRadius: "8px", padding: "10px 12px", fontSize: "12.5px", marginBottom: "14px", fontFamily: FONT_BODY,
    }}>
      <AlertTriangle size={15} style={{ flexShrink: 0, marginTop: "1px" }} />
      <span>{message}</span>
    </div>
  );
}

function friendlyAuthError(err) {
  const code = err && err.code ? err.code : "";
  if (code.includes("wrong-password") || code.includes("invalid-credential")) return "Incorrect email or password.";
  if (code.includes("user-not-found")) return "No account found with that email.";
  if (code.includes("email-already-in-use")) return "That email is already registered.";
  if (code.includes("weak-password")) return "Password should be at least 6 characters.";
  if (code.includes("invalid-email")) return "That email address doesn't look right.";
  if (code.includes("too-many-requests")) return "Too many attempts. Please wait a moment and try again.";
  return err && err.message ? err.message : "Something went wrong. Please try again.";
}

  const [businessName, setBusinessName] = useState("Fikirini's");

  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  const submit = async (e) => {
    e.preventDefault();
    setError("");
    if (password !== confirm) { setError("Passwords don't match."); return; }
    if (password.length < 6) { setError("Password should be at least 6 characters."); return; }
    setBusy(true);
    try {
      await createAdminAccount({ email, password, businessName, displayName });
      onDone && onDone();
    } catch (err) {
      setError(friendlyAuthError(err));
    } finally {
      setBusy(false);
    }
  };

  return (
    <AuthShell>
      <div style={{ marginBottom: "16px" }}>

      <form onSubmit={submit}>
        <Field label="Business name" value={businessName} onChange={(e) => setBusinessName(e.target.value)} placeholder="Fikirini's Barbershop" />

          onChange={(e) => setPassword(e.target.value)} placeholder="At least 6 characters"

function StaffPage() {
  const [staff, setStaff] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showModal, setShowModal] = useState(false);
  const [busyUid, setBusyUid] = useState(null);
  const [note, setNote] = useState("");

  useEffect(() => {
    const q = query(collection(db, "users"), where("role", "==", "staff"));
    const unsub = onSnapshot(q, (snap) => {
      const rows = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      rows.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      setStaff(rows);
      setLoading(false);
    });
    return () => unsub();
  }, []);

  const toggleActive = async (row) => {
    setBusyUid(row.id);
    try {
      await setStaffActive(row.id, !row.active);
      await logAudit(`${row.active ? "Deactivated" : "Activated"} staff account: ${row.displayName || row.username}`, "Medium");
    } finally {
      setBusyUid(null);
    }
  };

  const resetPw = async (row) => {
    setBusyUid(row.id);
    try {
      await sendReset(row.email);
      await logAudit(`Sent password reset email to ${row.displayName || row.username}`, "Low");
      setNote(`Password reset email sent to ${row.email}.`);
      setTimeout(() => setNote(""), 3500);
    } catch (err) {
      setNote(friendlyAuthError(err));
      setTimeout(() => setNote(""), 3500);
    } finally {
      setBusyUid(null);
    }
  };

  const columns = [
    { key: "displayName", label: "Name" },
    { key: "username", label: "Username", mono: true },
    { key: "email", label: "Email", mono: true },
    { key: "active", label: "Status", render: (r) => <Pill>{r.active ? "Active" : "Inactive"}</Pill> },
    {
      key: "actions", label: "Actions", render: (r) => (
        <div style={{ display: "flex", gap: "8px" }}>
          <button
            onClick={() => toggleActive(r)} disabled={busyUid === r.id}
            style={{
              display: "flex", alignItems: "center", gap: "5px", padding: "6px 10px", borderRadius: "6px",
              border: `1px solid ${C.line}`, background: r.active ? C.card : "#E1EBE3", color: r.active ? C.redDeep : C.green,
              fontFamily: FONT_BODY, fontSize: "11.5px", fontWeight: 600, cursor: "pointer",
            }}>
            <Power size={12} /> {r.active ? "Deactivate" : "Activate"}
          </button>
          <button
            onClick={() => resetPw(r)} disabled={busyUid === r.id}
            style={{
              display: "flex", alignItems: "center", gap: "5px", padding: "6px 10px", borderRadius: "6px",
              border: `1px solid ${C.line}`, background: C.card, color: C.blue,
              fontFamily: FONT_BODY, fontSize: "11.5px", fontWeight: 600, cursor: "pointer",
            }}>
            <KeyRound size={12} /> Reset password
          </button>
        </div>
      )
    },
  ];

  return (
    <div>
      <SectionHeader eyebrow="Team access" title="Staff Accounts" action={<AddButton label="New staff account" onClick={() => setShowModal(true)} />} />
      {note && (
        <div style={{ background: "#DEE5EC", color: C.blue, borderRadius: "8px", padding: "10px 14px", fontSize: "12.5px", marginBottom: "14px", fontFamily: FONT_BODY }}>{note}</div>
      )}
      {loading ? <LoadingBlock label="Loading staff accounts…" /> : staff.length === 0 ? (
        <EmptyState label="No staff accounts yet. Create one to give your team access." isAdmin={false} />
      ) : (
        <DataTable
          columns={columns}
          rows={staff}
          searchKeys={["displayName", "username", "email"]}
          filters={[{ key: "active", label: "Status", options: ["true", "false"] }]}
          defaultSort={{ key: "displayName", dir: "asc" }}
        />
      )}
      <div style={{ marginTop: "16px", fontFamily: FONT_BODY, fontSize: "11.5px", color: C.textDim, lineHeight: 1.5 }}>
        "Reset password" emails the staff member a secure link to set a new password themselves. Deactivating an account signs the staff member out and blocks their next sign-in until reactivated.
      </div>
      {showModal && <CreateStaffModal onClose={() => setShowModal(false)} />}
    </div>
  );
}

/* ---------------------------------- NAV / SHELL ---------------------------------- */
const NAV_BASE = [
  { group: "Overview", items: [{ key: "dashboard", label: "Dashboard", icon: LayoutDashboard }] },
  {
    group: "Operations", items: [
      { key: "appointments", label: "Appointments", icon: CalendarCheck },
      { key: "pos", label: "Point of Sale", icon: ShoppingCart },
      { key: "customers", label: "Customers", icon: Users },
      { key: "barbers", label: "Barbers", icon: Scissors },
      { key: "services", label: "Services", icon: UserCheck },
    ]
  },
  {
    group: "Stock & Money", items: [
      { key: "inventory", label: "Inventory", icon: Boxes },
      { key: "suppliers", label: "Suppliers", icon: Truck },
      { key: "expenses", label: "Expenses", icon: Receipt },
      { key: "payroll", label: "Payroll", icon: Wallet },
    ]
  },
  {
    group: "Insight", items: [
      { key: "reports", label: "Reports", icon: BarChart3 },
      { key: "audit", label: "Audit Log", icon: ShieldCheck },
    ]
  },
];

const ADMIN_GROUP = {
  group: "Admin", items: [
    { key: "staff", label: "Staff Accounts", icon: UserPlus },
    { key: "settings", label: "Settings", icon: SettingsIcon },
  ]
};

const PAGES = {
  dashboard: Dashboard, appointments: AppointmentsPage, pos: POSPage, customers: CustomersPage,
  barbers: BarbersPage, services: ServicesPage, inventory: InventoryPage, suppliers: SuppliersPage,
  expenses: ExpensesPage, payroll: PayrollPage, reports: ReportsPage, audit: AuditPage,
  staff: StaffPage, settings: SettingsPage,
};

function BarberShopApp({ profile, onLogout }) {
  const [page, setPage] = useState("dashboard");
  const isAdmin = profile && profile.role === "admin";
  const NAV = isAdmin ? [...NAV_BASE, ADMIN_GROUP] : NAV_BASE;
  const LABELS = Object.fromEntries(NAV.flatMap((g) => g.items).map((i) => [i.key, i.label]));
  const Page = PAGES[page] || Dashboard;
  const todayLabel = new Date().toLocaleDateString("en-GB", { weekday: "short", day: "2-digit", month: "short", year: "numeric" });

  return (
    <div style={{ fontFamily: FONT_BODY, background: C.paper, minHeight: "100vh", display: "flex" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
        * { box-sizing: border-box; }
        ::selection { background: ${C.red}; color: white; }
        input:focus, select:focus { border-color: ${C.red} !important; }
        table tr:hover td { background: ${C.paperDim}; }
        button { transition: opacity 0.15s ease; }
        button:hover { opacity: 0.85; }
        .spin { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
      `}</style>

      {/* Sidebar */}
      <aside style={{
        width: "252px", background: C.ink, color: C.white, flexShrink: 0, position: "sticky", top: 0,
        height: "100vh", display: "flex", flexDirection: "column",
        padding: "20px 14px", overflowY: "auto",
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: "10px", padding: "0 6px 20px 6px" }}>
          <StripeMark size={30} />
          <div>
            <div style={{ fontFamily: FONT_DISPLAY, fontSize: "16px", fontWeight: 700, lineHeight: 1.1 }}>Fikirini's</div>
            <div style={{ fontFamily: FONT_BODY, fontSize: "10.5px", color: "#9A98A0", letterSpacing: "0.5px" }}>BARBERSHOP MANAGER</div>
          </div>
        </div>

        {NAV.map((g) => (
          <div key={g.group} style={{ marginBottom: "16px" }}>
            <div style={{ fontFamily: FONT_BODY, fontSize: "10px", fontWeight: 700, color: "#75737C", letterSpacing: "1px", textTransform: "uppercase", padding: "0 10px 6px" }}>{g.group}</div>
            {g.items.map((it) => {
              const active = page === it.key;
              const Icon = it.icon;
              return (
                <button
                  key={it.key}
                  onClick={() => setPage(it.key)}
                  style={{
                    width: "100%", display: "flex", alignItems: "center", gap: "10px", padding: "9px 10px",
                    borderRadius: "7px", border: "none", cursor: "pointer", marginBottom: "2px",
                    background: active ? C.red : "transparent", color: active ? C.white : "#C9C7CF",
                    fontFamily: FONT_BODY, fontSize: "13px", fontWeight: active ? 600 : 500, textAlign: "left",
                  }}
                >
                  <Icon size={16} />
                  {it.label}
                </button>
              );
            })}
          </div>
        ))}

        <div style={{ marginTop: "auto", padding: "12px 10px", borderTop: "1px solid #2A2C34", fontFamily: FONT_BODY }}>
          <div style={{ fontSize: "12.5px", fontWeight: 600 }}>{profile?.displayName || profile?.username || "Account"}</div>
          <div style={{ fontSize: "11px", color: "#8B8992", marginBottom: "10px" }}>{isAdmin ? "Admin · All access" : "Staff"}</div>
          <button onClick={onLogout} style={{
            width: "100%", display: "flex", alignItems: "center", gap: "8px", padding: "8px 10px", borderRadius: "7px",
            border: "1px solid #2A2C34", background: "transparent", color: "#C9C7CF", fontFamily: FONT_BODY,
            fontSize: "12.5px", fontWeight: 500, cursor: "pointer",
          }}>
            <LogOut size={14} /> Sign out
          </button>
        </div>
      </aside>

      {/* Main content */}
      <main style={{ flex: 1, minWidth: 0 }}>
        <div style={{
          display: "flex", alignItems: "center", justifyContent: "space-between", padding: "14px 28px",
          borderBottom: `1px solid ${C.line}`, background: C.paper, position: "sticky", top: 0, zIndex: 5,
        }}>
          <div style={{ fontFamily: FONT_BODY, fontSize: "12.5px", color: C.textDim }}>
            <span style={{ color: C.text, fontWeight: 600 }}>Fikirini's</span> / {LABELS[page]}
          </div>
          <div style={{ fontFamily: FONT_MONO, fontSize: "12px", color: C.textDim }}>{todayLabel}</div>
        </div>
        <div style={{ padding: "26px 28px 60px" }}>
          <Page isAdmin={isAdmin} profile={profile} />
        </div>
      </main>
    </div>
  );
}

/* ---------------------------------- AUTH GATE (root) ---------------------------------- */
function Root() {
  const [booting, setBooting] = useState(true);
  const [adminExists, setAdminExists] = useState(true);
  const [authView, setAuthView] = useState("login");
  const [user, setUser] = useState(null);
  const [profile, setProfile] = useState(null);
  const [deactivated, setDeactivated] = useState(false);

  useEffect(() => {
    checkAdminExists().then(setAdminExists).catch(() => setAdminExists(true));
  }, []);

  useEffect(() => {
    const unsub = onAuthStateChanged(auth, (u) => {
      setUser(u);
      if (!u) { setProfile(null); setBooting(false); }
    });
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!user) return;
    const unsub = onSnapshot(doc(db, "users", user.uid), (snap) => {
      if (!snap.exists()) { setBooting(false); return; }
      const data = snap.data();
      if (data.active === false) {
        setDeactivated(true);
        logout();
        setProfile(null);
        setBooting(false);
        return;
      }
      CURRENT_USER_LABEL = data.displayName || data.username || data.email || "Someone";
      setProfile(data);
      setBooting(false);
    });
    return () => unsub();
  }, [user]);

  if (booting) {
    return (
      <div id="boot-loader"><div className="ring"></div><div>Loading Fikirini's…</div></div>
    );
  }

  if (deactivated && !user) {
    return <DeactivatedScreen onBackToLogin={() => setDeactivated(false)} />;
  }

  if (!user) {
    return authView === "createAdmin" && !adminExists ? (
      <CreateAdminScreen onDone={() => setAuthView("login")} />
    ) : (
      <LoginScreen adminExists={adminExists} onGoCreateAdmin={() => setAuthView("createAdmin")} />
    );
  }

  if (user && !profile) {
    return (
      <div id="boot-loader"><div className="ring"></div><div>Setting up your account…</div></div>
    );
  }

  return <BarberShopApp profile={profile} onLogout={logout} />;
}

const root = createRoot(document.getElementById("root"));
root.render(<Root />);
</script>
</body>
