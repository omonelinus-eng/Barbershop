    const qty = rInt(5, 40); const unitCost = rInt(150, 1200); const date = daysAgoStr(rInt(0, 90));
    const status = rBool(0.9) ? "Received" : "Returned";
    purchases.push({ date, supplier, item, qty, unitCost, total: qty * unitCost, branch: rPick(branches), status });
    stockMovements.push({ date, item, type: status === "Received" ? "Received" : "Adjusted", qty: status === "Received" ? qty : -qty, branch: rPick(branches), note: status === "Received" ? `Purchase from ${supplier}` : "Return to supplier" });
  }
  // Retail "Sold" / "Damaged" / "Expired" movements
  for (let i = 0; i < 90; i++) {
    stockMovements.push({ date: daysAgoStr(rInt(0, 90)), item: rPick(inventory).name, type: "Sold", qty: rInt(1, 4), branch: rPick(branches), note: "Retail sale at counter" });
  }
  for (let i = 0; i < 10; i++) {
    stockMovements.push({ date: daysAgoStr(rInt(0, 90)), item: rPick(inventory).name, type: "Damaged", qty: rInt(1, 3), branch: rPick(branches), note: "Damaged in storage" });
  }
  for (let i = 0; i < 8; i++) {
    stockMovements.push({ date: daysAgoStr(rInt(0, 60)), item: rPick(inventory).name, type: "Expired", qty: rInt(1, 5), branch: rPick(branches), note: "Past expiry, disposed" });
  }
  await batchInsert("purchases", purchases);
  await batchInsert("stockMovements", stockMovements);

  const expCategories = ["Rent", "Utilities", "Salaries", "Marketing", "Equipment Maintenance", "Supplies", "Other"];
  const expenses = [];
  for (let m = 0; m < 3; m++) {
    expenses.push({ date: daysAgoStr(m * 30 + rInt(0, 3)), category: "Rent", desc: "Monthly shop rent", amount: rInt(30000, 45000), approvedBy: "Owner", branch: rPick(branches) });
    expenses.push({ date: daysAgoStr(m * 30 + rInt(0, 3)), category: "Salaries", desc: "Support staff wages", amount: rInt(15000, 25000), approvedBy: "Owner", branch: rPick(branches) });
  }
  for (let i = 0; i < 40; i++) {
    const category = rPick(expCategories);
    expenses.push({
      date: daysAgoStr(rInt(0, 90)), category,
      desc: category === "Utilities" ? rPick(["Electricity bill", "Water bill", "Wi-Fi bill"])
        : category === "Marketing" ? rPick(["Facebook ads", "Flyers printing", "Instagram promotion"])
        : category === "Equipment Maintenance" ? rPick(["Clipper servicing", "Chair repair", "Sterilizer maintenance"])
        : category === "Supplies" ? rPick(["Cleaning supplies", "Office supplies"]) : rPick(["Miscellaneous", "Staff refreshments"]),
      amount: rInt(500, 6000), approvedBy: rPick(["Owner", "Manager"]), branch: rPick(branches),
    });
  }
  await batchInsert("expenses", expenses);

  // Appointments (past + upcoming) + Sales (linked loosely)
  const apptStatuses = ["Completed", "Completed", "Completed", "Completed", "Cancelled", "No-show"];
  const sources = ["Walk-in", "Phone", "Online", "Referral"];
  const methods = ["Cash", "M-Pesa", "Card", "Mixed"];
  const promoNames = ["NEWYEAR20", "STUDENT10", "REFER200", "BEARD15", "VIPBONUS"];
  const appointments = []; const sales = [];
  for (let i = 0; i < 150; i++) {
    const dayOffset = rInt(-45, 10);
    const date = dayOffset <= 0 ? daysAgoStr(-dayOffset) : daysFromNowStr(dayOffset);
    const isFuture = dayOffset > 0;
    const barber = rPick(barbers); const customer = rPick(customers); const service = rPick(services);
    const type = rBool(0.5) ? "Walk-in" : "Booking";
    const status = isFuture ? rPick(["Confirmed", "In Progress"]) : rPick(apptStatuses);
    const appt = {
      date, time: rTime(), customer: customer.name, barber: barber.name, service: service.name,
      type, status, branch: barber.branch, source: type === "Walk-in" ? "Walk-in" : rPick(sources),
    };
    if (!isFuture && type === "Walk-in") appt.waitMinutes = rInt(2, 28);
    appointments.push(appt);

    if (!isFuture && status === "Completed") {
      const extraServices = rBool(0.3) ? [rPick(services)] : [];
      const items = [service, ...extraServices].map((s) => ({ name: s.name, price: s.price }));
      const amount = items.reduce((a, it) => a + it.price, 0);
      const discount = rBool(0.15) ? Math.round(amount * rPick([0.1, 0.15, 0.2])) : 0;
      const sale = {
        date, time: appt.time, customer: customer.name, barber: barber.name, method: rPick(methods),
        items, itemsLabel: items.map((it) => it.name).join(", "),
        amount: amount - discount, cashier: rPick(["Grace Njeri", "Ann Wanjiru", "Owner"]),
        ms: new Date(date + "T" + appt.time).getTime(), voided: rBool(0.03),
        branch: barber.branch, discount, tip: rBool(0.4) ? rInt(20, 200) : 0,
        rating: rBool(0.7) ? rInt(3, 5) : 0,
        pointsRedeemed: rBool(0.08) ? rInt(50, 200) : 0,
        promo: discount > 0 && rBool(0.5) ? rPick(promoNames) : "",
      };
      if (rBool(0.3)) {
        const product = rPick(inventory); const qty = rInt(1, 2); const price = Math.round(product.unitCost * 1.6);
        sale.productItems = [{ name: product.name, price, qty }];
        sale.amount += price * qty; sale.itemsLabel += ` + ${product.name}`;
      }
      sales.push(sale);
    }
  }
  await batchInsert("appointments", appointments);
  await batchInsert("sales", sales);

  // Attendance — last ~50 weekdays per barber
  const attendance = [];
  for (const b of barbers) {
    let d = 0, recorded = 0;
    while (recorded < 45) {
      const day = new Date(); day.setDate(day.getDate() - d);
      d++;
      if (day.getDay() === 0) continue; // skip Sundays
      recorded++;
      attendance.push({ date: day.toISOString().slice(0, 10), barber: b.name, status: rBool(0.9) ? "Present" : rBool(0.5) ? "Late" : "Absent", branch: b.branch });
    }
  }
  await batchInsert("attendance", attendance);

  // Promotions
  const promotions = [
    { name: "NEWYEAR20", type: "Percentage", value: 20, startDate: daysAgoStr(60), endDate: daysAgoStr(30), usageCount: rInt(10, 40), branch: "All" },
    { name: "STUDENT10", type: "Percentage", value: 10, startDate: daysAgoStr(90), endDate: daysFromNowStr(90), usageCount: rInt(5, 25), branch: "All" },
    { name: "REFER200", type: "Fixed", value: 200, startDate: daysAgoStr(45), endDate: daysFromNowStr(45), usageCount: rInt(3, 15), branch: "All" },
    { name: "BEARD15", type: "Percentage", value: 15, startDate: daysAgoStr(20), endDate: daysFromNowStr(20), usageCount: rInt(5, 20), branch: "All" },
    { name: "VIPBONUS", type: "Fixed", value: 500, startDate: daysAgoStr(10), endDate: daysFromNowStr(80), usageCount: rInt(1, 8), branch: "All" },
  ];
  await batchInsert("promotions", promotions);

  // Bank/M-Pesa deposits
  const deposits = [];
  for (let i = 0; i < 35; i++) {
    deposits.push({ date: daysAgoStr(rInt(0, 90)), amount: rInt(2000, 20000), branch: rPick(branches), method: rBool(0.6) ? "Bank" : "Cash", reference: `DEP${rInt(100000, 999999)}` });
  }
  await batchInsert("deposits", deposits);
}

/* ============================================================
   NAVIGATION / SHELL
   ============================================================ */
const NAV = [
  { group: "Overview", items: [{ key: "dashboard", label: "Dashboard", icon: "dashboard", render: renderDashboard }] },
  { group: "Operations", items: [
    { key: "appointments", label: "Appointments", icon: "appointments", render: renderAppointments },
    { key: "pos", label: "Point of Sale", icon: "pos", render: renderPOS },
    { key: "customers", label: "Customers", icon: "customers", render: renderCustomers },
    { key: "barbers", label: "Barbers", icon: "barbers", render: renderBarbers },
    { key: "services", label: "Services", icon: "services", render: renderServices },
  ]},
  { group: "Stock & Money", items: [
    { key: "inventory", label: "Inventory", icon: "inventory", render: renderInventory },
    { key: "suppliers", label: "Suppliers", icon: "suppliers", render: renderSuppliers },
    { key: "expenses", label: "Expenses", icon: "expenses", render: renderExpenses, adminOnly: true },
    { key: "payroll", label: "Payroll", icon: "payroll", render: renderPayroll, adminOnly: true },
    { key: "branches", label: "Branches", icon: "branches", render: renderBranches, adminOnly: true },
  ]},
  { group: "Insight", items: [
    { key: "reports", label: "Reports", icon: "reports", render: renderReports, adminOnly: true },
    { key: "audit", label: "Audit Log", icon: "audit", render: renderAudit, adminOnly: true },
  ]},
  { group: "Admin", items: [
    { key: "staff", label: "Staff Management", icon: "staff", render: renderStaff, adminOnly: true },
    { key: "settings", label: "Settings", icon: "settings", render: renderSettings, adminOnly: true },
  ]},
];
const PAGE_LABEL = Object.fromEntries(NAV.flatMap((g) => g.items).map((i) => [i.key, i.label]));
const PAGE_RENDER = Object.fromEntries(NAV.flatMap((g) => g.items).map((i) => [i.key, i.render]));

let currentPage = "dashboard";
let currentUser = null;
let currentProfile = null;

function buildNav() {
  const container = document.getElementById("nav-container");
  container.innerHTML = NAV.map((g) => {
    const items = g.items.filter((it) => {
      if (isAdmin(currentProfile)) return true;
      if (currentProfile && currentProfile.moduleAccess) return canRead(it.key);
      return !it.adminOnly; // legacy account without a saved access grid
    });
    if (items.length === 0) return "";
    return `<div class="nav-group">
        <div class="nav-group-label">${escapeHtml(g.group)}</div>
        ${items.map((it) => `<button class="nav-btn ${it.key === currentPage ? "active" : ""}" data-page="${it.key}">${ICONS[it.icon]}${escapeHtml(it.label)}</button>`).join("")}
      </div>`;
  }).join("");
  container.querySelectorAll(".nav-btn").forEach((b) => b.addEventListener("click", () => goTo(b.dataset.page)));
}

function goTo(page) {
  currentPage = page;
  document.getElementById("crumb-page").textContent = PAGE_LABEL[page] || page;
  document.querySelectorAll(".nav-btn").forEach((b) => b.classList.toggle("active", b.dataset.page === page));
  document.getElementById("sidebar").classList.remove("open");
  const renderFn = PAGE_RENDER[page] || renderDashboard;
  renderFn(document.getElementById("page-wrap"));
}

function showAppShell() {
  document.getElementById("auth-screen").classList.add("hidden");
  document.getElementById("app-shell").classList.remove("hidden");
  document.getElementById("who-name").textContent = currentProfile.name;
  document.getElementById("who-role").textContent = currentProfile.role + (isAdmin(currentProfile) ? " · Full access" : "");
  document.getElementById("date-label").textContent = new Date().toLocaleDateString("en-KE", { weekday: "short", day: "2-digit", month: "short", year: "numeric" });
  buildNav();
  goTo("dashboard");
  subscribeAllData();
  if (isAdmin(currentProfile)) subscribeStaff();
}

function showAuthScreen(message) {
  document.getElementById("app-shell").classList.add("hidden");
  document.getElementById("auth-screen").classList.remove("hidden");
  if (staffUnsub) { staffUnsub(); staffUnsub = null; }
  unsubscribeAllData();
  renderAuthBody(message);
}

/* ---------- auth screen body (login / first-run signup) ---------- */
// We can't query the (locked-down) `users` collection before anyone is signed
// in, so bootstrap state lives in one small public doc instead: meta/setup.
let hasAnyUsers = null;
let bootstrapCheckError = null;
async function checkHasAnyUsers() {
  const snap = await getDoc(doc(db, "meta", "setup"));
  return snap.exists() && snap.data().adminExists === true;
}

async function renderAuthBody(message) {
  const authBody = document.getElementById("auth-body");
  authBody.innerHTML = `<div class="auth-loading" style="color:var(--text-dim);">Loading...</div>`;
  bootstrapCheckError = null;
  try { hasAnyUsers = await checkHasAnyUsers(); }
  catch (e) { hasAnyUsers = false; bootstrapCheckError = friendlyAuthError(e); }

  let tab = hasAnyUsers ? "login" : "signup";

  function draw() {
    authBody.innerHTML = `
      ${!hasAnyUsers ? `
        <div class="auth-tabs">
          <button class="auth-tab ${tab === "login" ? "active" : ""}" data-t="login">Sign in</button>
          <button class="auth-tab ${tab === "signup" ? "active" : ""}" data-t="signup">Create shop admin</button>
        </div>` : ""}
      ${message ? `<div class="auth-error">${escapeHtml(message)}</div>` : ""}
      ${bootstrapCheckError ? `<div class="auth-error">Couldn't reach the database: ${escapeHtml(bootstrapCheckError)} — check that Firestore is created and its rules are published (see setup notes), then reload.</div>` : ""}
      <div id="auth-form"></div>
    `;
    if (!hasAnyUsers) {
      authBody.querySelectorAll(".auth-tab").forEach((b) => b.addEventListener("click", () => { tab = b.dataset.t; draw(); }));
    }
    const formEl = document.getElementById("auth-form");
    if (tab === "signup" && !hasAnyUsers) {
      formEl.innerHTML = `
        <p class="auth-sub">This is a one-time step. The first account becomes the shop <b>Owner</b> and can create staff logins afterward.</p>
        <div class="field"><label>Your name</label><input id="su-name" placeholder="e.g. Grace Njeri" /></div>
        <div class="field"><label>Email</label><input id="su-email" type="email" placeholder="you@fikirinis.co.ke" /></div>
        <div class="field"><label>Password</label><input id="su-pw" type="password" placeholder="At least 6 characters" /></div>
        <div id="auth-err"></div>
        <button class="btn btn-primary" id="su-submit" style="width:100%;justify-content:center;padding:11px;">Create admin account</button>
      `;
      document.getElementById("su-submit").onclick = async () => {
        const name = document.getElementById("su-name").value.trim();
        const email = document.getElementById("su-email").value.trim();
        const password = document.getElementById("su-pw").value;
        const errEl = document.getElementById("auth-err");
        errEl.innerHTML = "";
        if (!name || !email || password.length < 6) { errEl.innerHTML = `<div class="auth-error">Fill in your name, email, and a password of at least 6 characters.</div>`; return; }
        const btn = document.getElementById("su-submit");
        btn.disabled = true; btn.textContent = "Creating...";
        try {
          const fresh = await checkHasAnyUsers();
          if (fresh) { errEl.innerHTML = `<div class="auth-error">An admin account already exists — please sign in instead.</div>`; hasAnyUsers = true; draw(); return; }
          const cred = await createUserWithEmailAndPassword(auth, email, password);
          await setDoc(doc(db, "users", cred.user.uid), { name, email, role: "Owner", active: true, createdAt: serverTimestamp(), createdBy: cred.user.uid });
          await setDoc(doc(db, "meta", "setup"), { adminExists: true, createdAt: serverTimestamp() });
        } catch (err) {
          errEl.innerHTML = `<div class="auth-error">${escapeHtml(friendlyAuthError(err))}</div>`;
          btn.disabled = false; btn.textContent = "Create admin account";
        }
      };
    } else {
      formEl.innerHTML = `
        ${hasAnyUsers ? `<p class="auth-note">Staff accounts are created by your admin in Staff Management. Use the login they shared with you.</p>` : ""}
        <div class="field"><label>Email</label><input id="li-email" type="email" placeholder="you@fikirinis.co.ke" /></div>
        <div class="field"><label>Password</label><input id="li-pw" type="password" placeholder="Your password" /></div>
        <div id="auth-err"></div>
        <button class="btn btn-primary" id="li-submit" style="width:100%;justify-content:center;padding:11px;">Sign in</button>
        <button class="btn btn-ghost" id="li-forgot" style="width:100%;justify-content:center;padding:9px;margin-top:8px;">Forgot password?</button>
      `;
      document.getElementById("li-submit").onclick = async () => {
        const email = document.getElementById("li-email").value.trim();
        const password = document.getElementById("li-pw").value;
        const errEl = document.getElementById("auth-err");
        errEl.innerHTML = "";
        const btn = document.getElementById("li-submit");
        btn.disabled = true; btn.textContent = "Signing in...";
        try { await signInWithEmailAndPassword(auth, email, password); }
        catch (err) { errEl.innerHTML = `<div class="auth-error">${escapeHtml(friendlyAuthError(err))}</div>`; btn.disabled = false; btn.textContent = "Sign in"; }
      };
      document.getElementById("li-forgot").onclick = async () => {
        const email = document.getElementById("li-email").value.trim();
        const errEl = document.getElementById("auth-err");
        if (!email) { errEl.innerHTML = `<div class="auth-error">Enter your email above first, then tap "Forgot password?" again.</div>`; return; }
        try { await sendPasswordResetEmail(auth, email); errEl.innerHTML = `<div class="auth-note">Reset link sent to ${escapeHtml(email)}.</div>`; }
        catch (err) { errEl.innerHTML = `<div class="auth-error">${escapeHtml(friendlyAuthError(err))}</div>`; }
      };
    }
  }
  draw();
}

applyBranding();
subscribeSettings();

/* ============================================================
   AUTH STATE
   ============================================================ */
onAuthStateChanged(auth, async (user) => {
  if (!user) { currentUser = null; currentProfile = null; showAuthScreen(); return; }
  currentUser = user;
  try {
    const snap = await getDoc(doc(db, "users", user.uid));
    if (!snap.exists()) { await signOut(auth); showAuthScreen("We couldn't find a profile for this account. Contact your admin."); return; }
    currentProfile = snap.data();
    if (currentProfile.active === false) { await signOut(auth); showAuthScreen("This account has been deactivated. Contact your admin."); return; }
    showAppShell();
    if (!sessionStorage.getItem("signedInLogged-" + user.uid)) {
      sessionStorage.setItem("signedInLogged-" + user.uid, "1");
      logAudit("Signed in", "Low");
    }
  } catch (err) {
    showAuthScreen(friendlyAuthError(err));
  }
});

document.getElementById("btn-signout").addEventListener("click", () => signOut(auth));
document.getElementById("btn-account").addEventListener("click", openAccountModal);
document.getElementById("menu-btn").addEventListener("click", () => document.getElementById("sidebar").classList.toggle("open"));

/* ============================================================
   PWA INSTALL PROMPT
   ============================================================ */
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("install-btn").classList.remove("hidden");
});
document.getElementById("install-btn").addEventListener("click", async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById("install-btn").classList.add("hidden");
});
window.addEventListener("appinstalled", () => { document.getElementById("install-btn").classList.add("hidden"); });

// iOS Safari has no beforeinstallprompt — show manual instructions once.
(function iosBanner() {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const isStandalone = window.navigator.standalone === true;
  if (isIOS && !isStandalone && !localStorage.getItem("ios-banner-dismissed")) {
    document.getElementById("ios-banner").classList.remove("hidden");
  }
  const dismiss = document.getElementById("ios-dismiss");
  if (dismiss) dismiss.addEventListener("click", () => {
    document.getElementById("ios-banner").classList.add("hidden");
    localStorage.setItem("ios-banner-dismissed", "1");
  });
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}

/* ============================================================
   OFFLINE / ONLINE STATUS
   The app never shows browser network errors: the service worker keeps the
   shell loading, and Firestore's local persistence keeps data readable and
   writable. All we do here is give a calm, honest signal of connection
   state instead of letting a failed request surface as an error anywhere.
   ============================================================ */
let pendingWrites = 0;
function updateNetStatus() {
  const pill = document.getElementById("net-status");
  const text = document.getElementById("net-status-text");
  if (!pill) return;
  if (!navigator.onLine) {
    pill.classList.remove("hidden");
    pill.className = "pill pill-warn";
    pill.style.display = "flex";
    text.textContent = "Offline — changes will sync later";
  } else if (pendingWrites > 0) {
    pill.classList.remove("hidden");
    pill.className = "pill pill-info";
    pill.style.display = "flex";
    text.textContent = "Syncing...";
  } else {
    pill.classList.add("hidden");
  }
}
window.addEventListener("online", () => { updateNetStatus(); toast("Back online — syncing any changes made offline.", "good"); });
window.addEventListener("offline", () => { updateNetStatus(); toast("You're offline. You can keep working — changes will sync automatically.", "default"); });
updateNetStatus();
</script>
