<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Fikirini's Barbershop Manager</title>
<meta name="description" content="Full accountability system for sales, staff, stock, and cash." />
<meta name="theme-color" content="#15171C" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Fikirini's" />

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --ink:#15171C; --ink-soft:#1F222A; --paper:#EFEDE7; --paper-dim:#E4E1D8; --card:#FBFAF7; --line:#D8D4C8;
    --text:#1B1D22; --text-dim:#6B6A63; --red:#B23A34; --red-deep:#8C2C28; --blue:#2E4763; --gold:#A9782F; --green:#3E6B4F; --white:#FFFFFF;
    --font-d:'Fraunces',serif; --font-b:'Inter',sans-serif; --font-m:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--text);font-family:var(--font-b);}
  ::selection{background:var(--red);color:#fff;}
  button{font-family:var(--font-b);cursor:pointer;transition:opacity .15s ease;}
  button:hover{opacity:.85;}
  button:disabled{opacity:.45;cursor:not-allowed;}
  input,select{font-family:var(--font-b);}
  input:focus,select:focus{outline:none;border-color:var(--red) !important;}
  a{color:inherit;}
  .hidden{display:none !important;}
  .mono{font-family:var(--font-m);}

  /* ---------- layout shell ---------- */
  #app-shell{display:flex;min-height:100vh;}
  .sidebar{width:252px;background:var(--ink);color:#fff;flex-shrink:0;position:sticky;top:0;height:100vh;
    display:flex;flex-direction:column;padding:20px 14px;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 6px 20px;}
  .stripe-mark{border-radius:999px;flex-shrink:0;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25);
    background:repeating-linear-gradient(45deg,var(--red) 0 6px,#fff 6px 12px,var(--blue) 12px 18px);}
  .brand-name{font-family:var(--font-d);font-size:16px;font-weight:700;line-height:1.1;}
  .brand-sub{font-family:var(--font-b);font-size:10.5px;color:#9A98A0;letter-spacing:.5px;}
  .nav-group{margin-bottom:16px;}
  .nav-group-label{font-size:10px;font-weight:700;color:#75737C;letter-spacing:1px;text-transform:uppercase;padding:0 10px 6px;}
  .nav-btn{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;border:none;
    cursor:pointer;margin-bottom:2px;background:transparent;color:#C9C7CF;font-size:13px;font-weight:500;text-align:left;}
  .nav-btn svg{flex-shrink:0;}
  .nav-btn.active{background:var(--red);color:#fff;font-weight:600;}
  .sidebar-foot{margin-top:auto;padding:12px 10px;border-top:1px solid #2A2C34;}
  .sidebar-foot .who-name{font-size:12.5px;font-weight:600;}
  .sidebar-foot .who-role{font-size:11px;color:#8B8992;}
  .sidebar-foot .foot-actions{display:flex;gap:6px;margin-top:10px;}
  .foot-btn{flex:1;font-size:11px;padding:6px 4px;border-radius:6px;border:1px solid #33353E;background:transparent;color:#C9C7CF;}

  main{flex:1;min-width:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;
    border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:5;gap:10px;flex-wrap:wrap;}
  .crumb{font-size:12.5px;color:var(--text-dim);}
  .crumb b{color:var(--text);font-weight:600;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .date-label{font-family:var(--font-m);font-size:12px;color:var(--text-dim);}
  .install-btn{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:7px;border:1px solid var(--line);
    background:var(--card);color:var(--text);font-size:12px;font-weight:600;}
  .page-wrap{padding:26px 28px 60px;max-width:1400px;}

  /* ---------- headers / cards ---------- */
  .section-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .eyebrow{font-size:11.5px;color:var(--red);font-weight:700;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:4px;}
  .h1{font-family:var(--font-d);font-size:28px;color:var(--text);margin:0;font-weight:600;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;}
  .stat-grid{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .stat-card{padding:16px 18px;flex:1;min-width:180px;}
  .stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .stat-label{font-size:12px;color:var(--text-dim);font-weight:600;letter-spacing:.3px;text-transform:uppercase;}
  .stat-value{font-family:var(--font-m);font-size:24px;color:var(--text);font-weight:600;}
  .stat-sub{font-size:12px;color:var(--text-dim);margin-top:4px;}

  /* ---------- pills / buttons ---------- */
  .pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.2px;display:inline-block;}
  .pill-neutral{background:#E7E4DA;color:var(--text-dim);}
  .pill-good{background:#E1EBE3;color:var(--green);}
  .pill-warn{background:#F3E6CF;color:var(--gold);}
  .pill-bad{background:#F3DEDB;color:var(--red-deep);}
  .pill-info{background:#DEE5EC;color:var(--blue);}
  .btn{padding:9px 14px;border-radius:8px;border:none;font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary{background:var(--red);color:#fff;}
  .btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--line);}
  .btn-sm{padding:5px 9px;font-size:11.5px;border-radius:6px;}
  .btn-danger{background:#F3DEDB;color:var(--red-deep);border:1px solid #E7C6C1;}
  .btn-ok{background:#E1EBE3;color:var(--green);border:1px solid #CFE2D4;}

  /* ---------- data table ---------- */
  .table-card{overflow:hidden;}
  .controls-bar{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .search-wrap{position:relative;flex:1 1 200px;min-width:180px;}
  .search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);pointer-events:none;}
  .search-input{width:100%;font-size:13px;padding:8px 10px 8px 30px;border:1px solid var(--line);border-radius:7px;
    background:var(--paper);color:var(--text);box-sizing:border-box;}
  .filter-select{font-size:12.5px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--text);}
  .count-label{font-family:var(--font-m);font-size:11.5px;color:var(--text-dim);margin-left:auto;white-space:nowrap;}
  .table-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;min-width:640px;}
  th{padding:10px 16px;cursor:pointer;user-select:none;font-size:11px;font-weight:700;color:var(--text-dim);
    letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--paper-dim);text-align:left;}
  .sort-ic{opacity:.45;font-size:10px;margin-left:3px;}
  td{padding:11px 16px;font-size:13px;color:var(--text);white-space:nowrap;border-bottom:1px solid var(--line);}
  tbody tr:hover td{background:var(--paper-dim);}
  .empty-row{text-align:center !important;padding:28px !important;color:var(--text-dim);white-space:normal !important;}
  .row-actions{display:flex;gap:6px;white-space:nowrap;}

  /* ---------- auth screens ---------- */
  #auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);padding:20px;}
  .auth-card{width:100%;max-width:380px;background:var(--card);border-radius:14px;padding:30px 28px;position:relative;overflow:hidden;}
  .auth-stripe{position:absolute;top:0;left:0;right:0;height:6px;background:repeating-linear-gradient(90deg,var(--red) 0 14px,#fff 14px 20px,var(--blue) 20px 34px);}
  .auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .auth-title{font-family:var(--font-d);font-size:20px;font-weight:600;margin:0 0 4px;}
  .auth-sub{font-size:12.5px;color:var(--text-dim);margin:0 0 20px;line-height:1.5;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--text-dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
  .field input,.field select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:13.5px;color:var(--text);}
  .auth-tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--paper);padding:4px;border-radius:9px;}
  .auth-tab{flex:1;padding:8px;border:none;border-radius:6px;background:transparent;font-size:12.5px;font-weight:600;color:var(--text-dim);}
  .auth-tab.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .auth-error{background:#F3DEDB;color:var(--red-deep);font-size:12.5px;padding:9px 11px;border-radius:8px;margin-bottom:14px;line-height:1.4;}
  .auth-note{background:#DEE5EC;color:var(--blue);font-size:12px;padding:9px 11px;border-radius:8px;margin-bottom:14px;line-height:1.4;}
  .auth-loading{color:#fff;font-family:var(--font-b);font-size:13px;text-align:center;}

  /* ---------- modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(21,23,28,.55);display:flex;align-items:center;justify-content:center;
    z-index:50;padding:16px;}
  .modal{width:100%;max-width:420px;background:var(--card);border-radius:12px;padding:24px;max-height:92vh;overflow-y:auto;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-title{font-family:var(--font-d);font-size:17px;font-weight:600;margin:0;}
  .modal-close{background:transparent;border:none;padding:4px;color:var(--text-dim);}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
  .credential-box{background:var(--ink);color:#fff;border-radius:9px;padding:14px;font-family:var(--font-m);font-size:12.5px;line-height:1.9;margin-top:10px;}
  .credential-box b{color:#F3E6CF;}

  /* ---------- toast ---------- */
  #toast-wrap{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:100;}
  .toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:8px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:320px;}

  /* ---------- pos ---------- */
  .pos-grid{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
  .pos-services{flex:1 1 320px;padding:16px;}
  .service-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
  .service-tile{text-align:left;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper);}
  .service-tile .n{font-size:12.5px;color:var(--text);font-weight:500;}
  .service-tile .p{font-size:11.5px;color:var(--text-dim);font-family:var(--font-m);}
  .ticket{flex:1 1 260px;background:var(--ink);border-radius:10px;padding:18px;color:#fff;position:relative;overflow:hidden;}
  .ticket-stripe{position:absolute;top:0;left:0;right:0;height:5px;background:repeating-linear-gradient(90deg,var(--red) 0 14px,#fff 14px 20px,var(--blue) 20px 34px);}
  .ticket-lines{margin-top:12px;display:flex;flex-direction:column;gap:6px;min-height:60px;}
  .ticket-line{display:flex;justify-content:space-between;font-family:var(--font-m);font-size:12.5px;}
  .ticket-empty{font-size:12.5px;color:#9A9CA6;opacity:.7;}
  .ticket-total{border-top:1px solid #333;margin-top:12px;padding-top:12px;display:flex;justify-content:space-between;
    font-family:var(--font-m);font-size:18px;font-weight:600;}
  .charge-btn{margin-top:14px;width:100%;padding:10px;border-radius:7px;border:none;background:var(--red);color:#fff;font-weight:600;font-size:13px;}

  /* ---------- dashboard chart ---------- */
  .dash-grid{display:flex;gap:16px;flex-wrap:wrap;}
  .chart-card{flex:2 1 380px;padding:18px;}
  .chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .chart-title{font-family:var(--font-d);font-size:16px;font-weight:600;}
  .chart-trend{display:flex;align-items:center;gap:4px;font-family:var(--font-m);font-size:12px;color:var(--green);}
  .bars{display:flex;align-items:flex-end;gap:14px;height:150px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .bar-val{font-family:var(--font-m);font-size:10.5px;color:var(--text-dim);}
  .bar{width:100%;max-width:34px;border-radius:4px 4px 0 0;background:var(--blue);}
  .bar.peak{background:var(--red);}
  .bar-day{font-size:11px;color:var(--text-dim);}
  .stock-card{flex:1 1 260px;padding:18px;}
  .stock-row{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:8px;}
  .stock-row:last-child{border:none;margin:0;padding:0;}
  .stock-name{font-size:13px;color:var(--text);font-weight:500;}
  .stock-meta{font-family:var(--font-m);font-size:11px;color:var(--text-dim);}

  /* ---------- report tabs ---------- */
  .report-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .report-tab{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:12.5px;font-weight:600;}
  .report-tab.active{background:var(--red);color:#fff;border-color:var(--red);}

  /* ---------- ios install banner ---------- */
  #ios-banner{position:fixed;left:12px;right:12px;bottom:12px;background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;
    display:flex;align-items:center;gap:10px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3);}
  #ios-banner p{margin:0;font-size:12.5px;line-height:1.4;flex:1;}
  #ios-banner button{background:transparent;border:none;color:#9A9CA6;padding:4px;}

  @media (max-width:860px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .2s ease;}
    .sidebar.open{transform:translateX(0);}
    .menu-btn{display:inline-flex !important;}
    .page-wrap{padding:20px 16px 50px;}
    .topbar{padding:12px 16px;}
  }
  .menu-btn{display:none;background:transparent;border:none;color:var(--text);padding:6px;margin-right:4px;}
</style>
</head>
<body>

<!-- ============================= AUTH SCREEN ============================= -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-stripe"></div>
    <div class="auth-brand">
      <div class="stripe-mark" style="width:30px;height:30px;"></div>
      <div>
        <div class="brand-name" style="color:var(--text);">Fikirini's</div>
        <div class="brand-sub" style="color:var(--text-dim);">BARBERSHOP MANAGER</div>
      </div>
    </div>
    <div id="auth-body"><div class="auth-loading" style="color:var(--text-dim);">Loading...</div></div>
  </div>
</div>

<!-- ============================= APP SHELL ============================= -->
<div id="app-shell" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="stripe-mark" style="width:30px;height:30px;"></div>
      <div>
        <div class="brand-name">Fikirini's</div>
        <div class="brand-sub">BARBERSHOP MANAGER</div>
      </div>
    </div>
    <div id="nav-container"></div>
    <div class="sidebar-foot">
      <div class="who-name" id="who-name">—</div>
      <div class="who-role" id="who-role">—</div>
      <div class="foot-actions">
        <button class="foot-btn" id="btn-account">Account</button>
        <button class="foot-btn" id="btn-signout">Sign out</button>
      </div>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div style="display:flex;align-items:center;">
        <button class="menu-btn" id="menu-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="crumb"><b>Fikirini's</b> / <span id="crumb-page">Dashboard</span></div>
      </div>
      <div class="topbar-right">
        <button class="install-btn hidden" id="install-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
          Install app
        </button>
        <div class="date-label" id="date-label"></div>
      </div>
    </div>
    <div class="page-wrap" id="page-wrap"></div>
  </main>
</div>

<div id="toast-wrap"></div>
<div id="modal-root"></div>

<div id="ios-banner" class="hidden">
  <p>Install this app: tap <b>Share</b>, then <b>Add to Home Screen</b>.</p>
  <button id="ios-dismiss">✕</button>
</div>

<script type="module">
/* ============================================================
   FIREBASE SETUP
   ============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  signOut, sendPasswordResetEmail, updatePassword, EmailAuthProvider, reauthenticateWithCredential,
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import {
  getFirestore, doc, setDoc, getDoc, getDocs, collection, query, where, orderBy,
  onSnapshot, updateDoc, serverTimestamp, limit,
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCpe_kBZ57n-jtKSB6PaNy5GgxKZAetrHs",
  authDomain: "barbershop-a96bd.firebaseapp.com",
  projectId: "barbershop-a96bd",
  storageBucket: "barbershop-a96bd.firebasestorage.app",
  messagingSenderId: "123892155529",
  appId: "1:123892155529:web:d72da4f73229e127dff258",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// A second, independent Firebase app instance. We use this ONLY to create
// staff accounts, so that creating a new sign-in does not swap out the
// admin's own active session (the Firebase client SDK auto-signs-in as
// whichever user you just created on a given auth instance).
const secondaryApp = initializeApp(firebaseConfig, "Secondary");
const secondaryAuth = getAuth(secondaryApp);

/* ============================================================
   CONSTANTS / HELPERS
   ============================================================ */
const ADMIN_ROLES = ["Owner", "Manager"];
const ALL_ROLES = ["Owner", "Manager", "Barber", "Cashier", "Receptionist"];
const isAdmin = (profile) => !!profile && ADMIN_ROLES.includes(profile.role);

const money = (n) => "KSh " + Math.round(n || 0).toLocaleString("en-KE");
const escapeHtml = (s) => String(s ?? "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

function toast(msg, tone = "default") {
  const wrap = document.getElementById("toast-wrap");
  const el = document.createElement("div");
  el.className = "toast";
  if (tone === "bad") el.style.background = "#8C2C28";
  if (tone === "good") el.style.background = "#3E6B4F";
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

function friendlyAuthError(err) {
  const code = err && err.code ? err.code : "";
  const map = {
    "auth/email-already-in-use": "That email is already registered.",
    "auth/invalid-email": "That email address doesn't look right.",
    "auth/weak-password": "Password should be at least 6 characters.",
    "auth/user-not-found": "No account found with that email.",
    "auth/wrong-password": "Incorrect password.",
    "auth/invalid-credential": "Incorrect email or password.",
    "auth/too-many-requests": "Too many attempts. Please wait a moment and try again.",
    "auth/network-request-failed": "Network error — check your connection.",
  };
  return map[code] || (err && err.message) || "Something went wrong.";
}

function pill(text, toneMap) {
  const tones = {
    Active: "good", Confirmed: "info", Completed: "good", "In Progress": "warn",
    "No-show": "bad", Cancelled: "bad", "On Leave": "warn", OK: "good", Low: "warn",
    Critical: "bad", VIP: "info", Standard: "neutral", New: "warn",
    High: "bad", Medium: "warn", Inactive: "neutral", Deactivated: "bad",
    Owner: "info", Manager: "info", Barber: "neutral", Cashier: "neutral", Receptionist: "neutral",
  };
  const tone = (toneMap && toneMap[text]) || tones[text] || "neutral";
  return `<span class="pill pill-${tone}">${escapeHtml(text)}</span>`;
}

/* ============================================================
   GENERIC DATA TABLE  (search + filter + sort, used everywhere)
   ============================================================ */
function mountDataTable(container, opts) {
  const state = { search: "", filters: {}, sort: opts.defaultSort || { key: opts.columns[0].key, dir: "asc" } };

  container.innerHTML = `
    <div class="card table-card">
      <div class="controls-bar">
        <div class="search-wrap">${ICONS.search}<input class="search-input" placeholder="Search..." /></div>
        ${(opts.filters || []).map((f) => `
          <select class="filter-select" data-key="${f.key}">
            <option value="All">${escapeHtml(f.label)}: All</option>
            ${f.options.map((o) => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join("")}
          </select>`).join("")}
        <span class="count-label"></span>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr>
            ${opts.columns.map((c) => `<th data-key="${c.key}" style="text-align:${c.align || "left"}">${escapeHtml(c.label)}<span class="sort-ic"></span></th>`).join("")}
            ${opts.rowActions ? "<th>Actions</th>" : ""}
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>`;

  const searchInput = container.querySelector(".search-input");
  const tbody = container.querySelector("tbody");
  const countLabel = container.querySelector(".count-label");
  const ths = container.querySelectorAll("th[data-key]");

  function getRows() { return typeof opts.rows === "function" ? opts.rows() : opts.rows; }

  function computeRows() {
    let rows = getRows();
    if (state.search.trim()) {
      const q = state.search.toLowerCase();
      rows = rows.filter((r) => opts.searchKeys.some((k) => String(r[k] ?? "").toLowerCase().includes(q)));
    }
    Object.entries(state.filters).forEach(([k, v]) => { if (v && v !== "All") rows = rows.filter((r) => String(r[k]) === v); });
    rows = [...rows].sort((a, b) => {
      const av = a[state.sort.key], bv = b[state.sort.key];
      const an = parseFloat(String(av).replace(/[^0-9.-]/g, "")), bn = parseFloat(String(bv).replace(/[^0-9.-]/g, ""));
      let cmp;
      if (!isNaN(an) && !isNaN(bn) && String(av).match(/[0-9]/)) cmp = an - bn; else cmp = String(av).localeCompare(String(bv));
      return state.sort.dir === "asc" ? cmp : -cmp;
    });
    return rows;
  }

  function render() {
    const rows = computeRows();
    countLabel.textContent = `${rows.length} of ${getRows().length}`;
    ths.forEach((th) => {
      const ic = th.querySelector(".sort-ic");
      ic.textContent = state.sort.key === th.dataset.key ? (state.sort.dir === "asc" ? " ▲" : " ▼") : " ↕";
    });
    if (rows.length === 0) {
      tbody.innerHTML = `<tr><td colspan="${opts.columns.length + (opts.rowActions ? 1 : 0)}" class="empty-row">Nothing matches this filter. Adjust the search or filters above.</td></tr>`;
      return;
    }
    tbody.innerHTML = rows.map((r) => `<tr>
        ${opts.columns.map((c) => `<td style="text-align:${c.align || "left"}" class="${c.mono ? "mono" : ""}">${c.render ? c.render(r) : escapeHtml(r[c.key] ?? "")}</td>`).join("")}
        ${opts.rowActions ? `<td class="row-actions">${opts.rowActions(r)}</td>` : ""}
      </tr>`).join("");
  }

  searchInput.addEventListener("input", (e) => { state.search = e.target.value; render(); });
  container.querySelectorAll(".filter-select").forEach((sel) => {
    sel.addEventListener("change", () => { state.filters[sel.dataset.key] = sel.value; render(); });
  });
  ths.forEach((th) => {
    th.addEventListener("click", () => {
      const key = th.dataset.key;
      state.sort = state.sort.key === key ? { key, dir: state.sort.dir === "asc" ? "desc" : "asc" } : { key, dir: "asc" };
      render();
    });
  });
  if (opts.onMount) opts.onMount(container, render);
  render();
  return { refresh: render };
}

let staffDocs = [];
let staffUnsub = null;

function renderStaff(root) {
  root.innerHTML = `
    ${sectionHeader("Accounts & access", "Staff Management", addBtn("Add staff account", "add-staff"))}
    <div class="card" style="padding:12px 16px;margin-bottom:14px;font-size:12.5px;color:var(--text-dim);line-height:1.5;">
      New accounts are created with a temporary password you set. Share it with the staff member yourself
      (WhatsApp, SMS, in person) — it's shown once, right after creation. Deactivating an account blocks
      that person from getting past sign-in immediately; it does not delete their history.
    </div>
    <div id="staff-table"></div>`;
  document.getElementById("add-staff").onclick = openAddStaffModal;

  mountDataTable(document.getElementById("staff-table"), {
    columns: [
      { key: "name", label: "Name" },
      { key: "email", label: "Login email", mono: true },
      { key: "role", label: "Role", render: (r) => pill(r.role) },
      { key: "active", label: "Status", render: (r) => (r.active === false ? pill("Deactivated") : pill("Active")) },
    ],
    rows: () => staffDocs,
    searchKeys: ["name", "email"],
    filters: [
      { key: "role", label: "Role", options: ALL_ROLES },
    ],
    defaultSort: { key: "name", dir: "asc" },
    rowActions: (r) => {
      const isSelf = r.uid === currentUser?.uid;
      const activeBtn = r.active === false
        ? `<button class="btn btn-sm btn-ok" data-act="activate" data-uid="${r.uid}">Activate</button>`
        : `<button class="btn btn-sm btn-danger" data-act="deactivate" data-uid="${r.uid}" ${isSelf ? "disabled title=\"You can't deactivate yourself\"" : ""}>Deactivate</button>`;
      return `${activeBtn}
        <button class="btn btn-sm btn-ghost" data-act="reset" data-uid="${r.uid}" data-email="${escapeHtml(r.email)}">Reset password</button>
        <button class="btn btn-sm btn-ghost" data-act="role" data-uid="${r.uid}" data-role="${r.role}">Edit role</button>`;
    },
    onMount: (container) => {
      container.addEventListener("click", async (e) => {
        const btn = e.target.closest("button[data-act]");
        if (!btn) return;
        const act = btn.dataset.act, uid = btn.dataset.uid;
        if (act === "deactivate") {
          if (!confirm("Deactivate this account? They won't be able to sign in until reactivated.")) return;
          await updateDoc(doc(db, "users", uid), { active: false });
          toast("Account deactivated.", "good");
        } else if (act === "activate") {
          await updateDoc(doc(db, "users", uid), { active: true });
          toast("Account reactivated.", "good");
        } else if (act === "reset") {
          try { await sendPasswordResetEmail(auth, btn.dataset.email); toast(`Password reset link sent to ${btn.dataset.email}.`, "good"); }
          catch (err) { toast(friendlyAuthError(err), "bad"); }
        } else if (act === "role") {
          openEditRoleModal(uid, btn.dataset.role);
        }
      });
    },
  });
}

function subscribeStaff() {
  if (staffUnsub) staffUnsub();
  staffUnsub = onSnapshot(collection(db, "users"), (snap) => {
    staffDocs = snap.docs.map((d) => ({ uid: d.id, ...d.data() }));
    const staffTable = document.getElementById("staff-table");
    if (staffTable) mountStaffRefresh();
  });
}
function mountStaffRefresh() {
  // cheap re-mount keeps this simple and correct after live Firestore updates
  const root = document.getElementById("page-wrap");
  if (currentPage === "staff") renderStaff(root);
}

function openModal(html) {
  const root = document.getElementById("modal-root");
  root.innerHTML = `<div class="modal-overlay" id="modal-overlay"><div class="modal">${html}</div></div>`;
  document.getElementById("modal-overlay").addEventListener("click", (e) => { if (e.target.id === "modal-overlay") closeModal(); });
}
function closeModal() { document.getElementById("modal-root").innerHTML = ""; }

function genPassword() {
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789";
  let out = "";
  for (let i = 0; i < 10; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return out;
}

function openAddStaffModal() {
  const tempPw = genPassword();
  openModal(`
    <div class="modal-head"><h3 class="modal-title">Add staff account</h3><button class="modal-close" id="m-close">✕</button></div>
    <div class="field"><label>Full name</label><input id="f-name" placeholder="e.g. Ann Wanjiru" /></div>
    <div class="field"><label>Login email</label><input id="f-email" type="email" placeholder="ann@fikirinis.co.ke" /></div>
    <div class="field"><label>Role</label>
      <select id="f-role">${ALL_ROLES.filter((r) => r !== "Owner").map((r) => `<option value="${r}">${r}</option>`).join("")}</select>
    </div>
    <div class="field"><label>Temporary password</label><input id="f-pw" value="${tempPw}" /></div>
    <div id="m-error"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="m-cancel">Cancel</button>
      <button class="btn btn-primary" id="m-submit">Create account</button>
    </div>
  `);
  document.getElementById("m-close").onclick = closeModal;
  document.getElementById("m-cancel").onclick = closeModal;
  document.getElementById("m-submit").onclick = async () => {
    const name = document.getElementById("f-name").value.trim();
    const email = document.getElementById("f-email").value.trim();
    const role = document.getElementById("f-role").value;
    const password = document.getElementById("f-pw").value;
    const errEl = document.getElementById("m-error");
    errEl.innerHTML = "";
    if (!name || !email || password.length < 6) {
      errEl.innerHTML = `<div class="auth-error">Fill in a name, valid email, and a password of at least 6 characters.</div>`;
      return;
    }
    const btn = document.getElementById("m-submit");
    btn.disabled = true; btn.textContent = "Creating...";
    try {
      const cred = await createUserWithEmailAndPassword(secondaryAuth, email, password);
      await setDoc(doc(db, "users", cred.user.uid), {
        name, email, role, active: true, createdAt: serverTimestamp(), createdBy: currentUser.uid,
      });
      await signOut(secondaryAuth);
      openModal(`
        <div class="modal-head"><h3 class="modal-title">Account created</h3><button class="modal-close" id="m-close2">✕</button></div>
        <p style="font-size:13px;color:var(--text-dim);line-height:1.5;">Share these credentials with ${escapeHtml(name)} yourself. This is the only time the password is shown.</p>
        <div class="credential-box">
          <div>Email: <b>${escapeHtml(email)}</b></div>
          <div>Password: <b>${escapeHtml(password)}</b></div>
        </div>
        <div class="modal-actions"><button class="btn btn-primary" id="m-done">Done</button></div>
      `);
      document.getElementById("m-close2").onclick = closeModal;
      document.getElementById("m-done").onclick = closeModal;
      toast(`${name}'s account is ready.`, "good");
    } catch (err) {
      try { await signOut(secondaryAuth); } catch (_) {}
      errEl.innerHTML = `<div class="auth-error">${escapeHtml(friendlyAuthError(err))}</div>`;
      btn.disabled = false; btn.textContent = "Create account";
    }
  };
}

    <div class="field"><label>Name</label><input value="${escapeHtml(currentProfile.name)}" disabled /></div>
    <div class="field"><label>Email</label><input value="${escapeHtml(currentProfile.email)}" disabled /></div>
    <hr style="border:none;border-top:1px solid var(--line);margin:16px 0;" />
    <div class="field"><label>Current password</label><input id="f-cur" type="password" /></div>
    <div class="field"><label>New password</label><input id="f-new" type="password" /></div>
    <div id="m-error"></div>
    <div class="modal-actions"><button class="btn btn-ghost" id="m-cancel">Cancel</button><button class="btn btn-primary" id="m-change">Change password</button></div>
  `);
  document.getElementById("m-close").onclick = closeModal;
  document.getElementById("m-cancel").onclick = closeModal;
  document.getElementById("m-change").onclick = async () => {
    const cur = document.getElementById("f-cur").value;
    const next = document.getElementById("f-new").value;
    const errEl = document.getElementById("m-error");
    errEl.innerHTML = "";
    if (!cur || next.length < 6) { errEl.innerHTML = `<div class="auth-error">Enter your current password and a new one of at least 6 characters.</div>`; return; }
    try {
      const credential = EmailAuthProvider.credential(currentUser.email, cur);
      await reauthenticateWithCredential(currentUser, credential);
      await updatePassword(currentUser, next);
      toast("Password changed.", "good");
      closeModal();
    } catch (err) {
      errEl.innerHTML = `<div class="auth-error">${escapeHtml(friendlyAuthError(err))}</div>`;
    }
  };
}

/* ============================================================
   NAVIGATION / SHELL
   ============================================================ */
const NAV = [
  { group: "Overview", items: [{ key: "dashboard", label: "Dashboard", icon: "dashboard", render: renderDashboard }] },
  { group: "Operations", items: [
    { key: "appointments", label: "Appointments", icon: "appointments", render: renderAppointments },
    { key: "pos", label: "Point of Sale", icon: "pos", render: renderPOS },
    { key: "customers", label: "Customers", icon: "customers", render: renderCustomers },
    { key: "barbers", label: "Barbers", icon: "barbers", render: renderBarbers },
    { key: "services", label: "Services", icon: "services", render: renderServices },
  ]},
  { group: "Stock & Money", items: [
    { key: "inventory", label: "Inventory", icon: "inventory", render: renderInventory },
    { key: "suppliers", label: "Suppliers", icon: "suppliers", render: renderSuppliers },
    { key: "expenses", label: "Expenses", icon: "expenses", render: renderExpenses, adminOnly: true },
    { key: "payroll", label: "Payroll", icon: "payroll", render: renderPayroll, adminOnly: true },
  ]},
  { group: "Insight", items: [
    { key: "reports", label: "Reports", icon: "reports", render: renderReports, adminOnly: true },
    { key: "audit", label: "Audit Log", icon: "audit", render: renderAudit, adminOnly: true },
  ]},
  { group: "Admin", items: [
    { key: "staff", label: "Staff Management", icon: "staff", render: renderStaff, adminOnly: true },
  ]},
];
const PAGE_LABEL = Object.fromEntries(NAV.flatMap((g) => g.items).map((i) => [i.key, i.label]));
const PAGE_RENDER = Object.fromEntries(NAV.flatMap((g) => g.items).map((i) => [i.key, i.render]));

let currentPage = "dashboard";
let currentUser = null;
let currentProfile = null;

function buildNav() {
  const container = document.getElementById("nav-container");
  container.innerHTML = NAV.map((g) => {
    const items = g.items.filter((it) => !it.adminOnly || isAdmin(currentProfile));
    if (items.length === 0) return "";
    return `<div class="nav-group">
        <div class="nav-group-label">${escapeHtml(g.group)}</div>
        ${items.map((it) => `<button class="nav-btn ${it.key === currentPage ? "active" : ""}" data-page="${it.key}">${ICONS[it.icon]}${escapeHtml(it.label)}</button>`).join("")}
      </div>`;
  }).join("");
  container.querySelectorAll(".nav-btn").forEach((b) => b.addEventListener("click", () => goTo(b.dataset.page)));
}

function goTo(page) {
  currentPage = page;
  document.getElementById("crumb-page").textContent = PAGE_LABEL[page] || page;
  document.querySelectorAll(".nav-btn").forEach((b) => b.classList.toggle("active", b.dataset.page === page));
  document.getElementById("sidebar").classList.remove("open");
  const renderFn = PAGE_RENDER[page] || renderDashboard;
  renderFn(document.getElementById("page-wrap"));
}

function showAppShell() {
  document.getElementById("auth-screen").classList.add("hidden");
  document.getElementById("app-shell").classList.remove("hidden");
  document.getElementById("who-name").textContent = currentProfile.name;
  document.getElementById("who-role").textContent = currentProfile.role + (isAdmin(currentProfile) ? " · Full access" : "");
  document.getElementById("date-label").textContent = new Date().toLocaleDateString("en-KE", { weekday: "short", day: "2-digit", month: "short", year: "numeric" });
  buildNav();
  goTo(isAdmin(currentProfile) ? "dashboard" : "dashboard");
  if (isAdmin(currentProfile)) subscribeStaff();
}

function showAuthScreen(message) {
  document.getElementById("app-shell").classList.add("hidden");
  document.getElementById("auth-screen").classList.remove("hidden");
  if (staffUnsub) { staffUnsub(); staffUnsub = null; }
  renderAuthBody(message);
}

/* ---------- auth screen body (login / first-run signup) ---------- */
let hasAnyUsers = null;
async function checkHasAnyUsers() {
  const snap = await getDocs(query(collection(db, "users"), limit(1)));
  return !snap.empty;
}

async function renderAuthBody(message) {
  const authBody = document.getElementById("auth-body");
  authBody.innerHTML = `<div class="auth-loading" style="color:var(--text-dim);">Loading...</div>`;
  try { hasAnyUsers = await checkHasAnyUsers(); } catch (e) { hasAnyUsers = true; }

  let tab = hasAnyUsers ? "login" : "signup";

  function draw() {
    authBody.innerHTML = `
      ${!hasAnyUsers ? `
        <div class="auth-tabs">
          <button class="auth-tab ${tab === "login" ? "active" : ""}" data-t="login">Sign in</button>
          <button class="auth-tab ${tab === "signup" ? "active" : ""}" data-t="signup">Create shop admin</button>
        </div>` : ""}
      ${message ? `<div class="auth-error">${escapeHtml(message)}</div>` : ""}
      ${hasAnyUsers && tab === "signup" ? "" : ""}
      <div id="auth-form"></div>
    `;
    if (!hasAnyUsers) {
      authBody.querySelectorAll(".auth-tab").forEach((b) => b.addEventListener("click", () => { tab = b.dataset.t; draw(); }));
    }
    const formEl = document.getElementById("auth-form");
    if (tab === "signup" && !hasAnyUsers) {
      formEl.innerHTML = `
        <p class="auth-sub">This is a one-time step. The first account becomes the shop <b>Owner</b> and can create staff logins afterward.</p>
        <div class="field"><label>Your name</label><input id="su-name" placeholder="e.g. Grace Njeri" /></div>
        <div class="field"><label>Email</label><input id="su-email" type="email" placeholder="you@fikirinis.co.ke" /></div>
        <div class="field"><label>Password</label><input id="su-pw" type="password" placeholder="At least 6 characters" /></div>
        <div id="auth-err"></div>
        <button class="btn btn-primary" id="su-submit" style="width:100%;justify-content:center;padding:11px;">Create admin account</button>
      `;
      document.getElementById("su-submit").onclick = async () => {
        const name = document.getElementById("su-name").value.trim();
        const email = document.getElementById("su-email").value.trim();
        const password = document.getElementById("su-pw").value;
        const errEl = document.getElementById("auth-err");
        errEl.innerHTML = "";
        if (!name || !email || password.length < 6) { errEl.innerHTML = `<div class="auth-error">Fill in your name, email, and a password of at least 6 characters.</div>`; return; }
        const btn = document.getElementById("su-submit");
        btn.disabled = true; btn.textContent = "Creating...";
        try {
          const fresh = await checkHasAnyUsers();
          if (fresh) { errEl.innerHTML = `<div class="auth-error">An admin account already exists — please sign in instead.</div>`; hasAnyUsers = true; draw(); return; }
          const cred = await createUserWithEmailAndPassword(auth, email, password);
          await setDoc(doc(db, "users", cred.user.uid), { name, email, role: "Owner", active: true, createdAt: serverTimestamp(), createdBy: cred.user.uid });
        } catch (err) {
          errEl.innerHTML = `<div class="auth-error">${escapeHtml(friendlyAuthError(err))}</div>`;
          btn.disabled = false; btn.textContent = "Create admin account";
        }
      };
    } else {
      formEl.innerHTML = `
        ${hasAnyUsers ? `<p class="auth-note">Staff accounts are created by your admin in Staff Management. Use the login they shared with you.</p>` : ""}
        <div class="field"><label>Email</label><input id="li-email" type="email" placeholder="you@fikirinis.co.ke" /></div>
        <div class="field"><label>Password</label><input id="li-pw" type="password" placeholder="Your password" /></div>
        <div id="auth-err"></div>
        <button class="btn btn-primary" id="li-submit" style="width:100%;justify-content:center;padding:11px;">Sign in</button>
        <button class="btn btn-ghost" id="li-forgot" style="width:100%;justify-content:center;padding:9px;margin-top:8px;">Forgot password?</button>
      `;
      document.getElementById("li-submit").onclick = async () => {
        const email = document.getElementById("li-email").value.trim();
        const password = document.getElementById("li-pw").value;
        const errEl = document.getElementById("auth-err");
        errEl.innerHTML = "";
        const btn = document.getElementById("li-submit");
        btn.disabled = true; btn.textContent = "Signing in...";
        try { await signInWithEmailAndPassword(auth, email, password); }
        catch (err) { errEl.innerHTML = `<div class="auth-error">${escapeHtml(friendlyAuthError(err))}</div>`; btn.disabled = false; btn.textContent = "Sign in"; }
      };
      document.getElementById("li-forgot").onclick = async () => {
        const email = document.getElementById("li-email").value.trim();
        const errEl = document.getElementById("auth-err");
        if (!email) { errEl.innerHTML = `<div class="auth-error">Enter your email above first, then tap "Forgot password?" again.</div>`; return; }
        try { await sendPasswordResetEmail(auth, email); errEl.innerHTML = `<div class="auth-note">Reset link sent to ${escapeHtml(email)}.</div>`; }
        catch (err) { errEl.innerHTML = `<div class="auth-error">${escapeHtml(friendlyAuthError(err))}</div>`; }
      };
    }
  }
  draw();
}

/* ============================================================
   AUTH STATE
   ============================================================ */
onAuthStateChanged(auth, async (user) => {
  if (!user) { currentUser = null; currentProfile = null; showAuthScreen(); return; }
  currentUser = user;
  try {
    const snap = await getDoc(doc(db, "users", user.uid));
    if (!snap.exists()) { await signOut(auth); showAuthScreen("We couldn't find a profile for this account. Contact your admin."); return; }
    currentProfile = snap.data();
    if (currentProfile.active === false) { await signOut(auth); showAuthScreen("This account has been deactivated. Contact your admin."); return; }
    showAppShell();
  } catch (err) {
    showAuthScreen(friendlyAuthError(err));
  }
});

document.getElementById("btn-signout").addEventListener("click", () => signOut(auth));
document.getElementById("btn-account").addEventListener("click", openAccountModal);
document.getElementById("menu-btn").addEventListener("click", () => document.getElementById("sidebar").classList.toggle("open"));

/* ============================================================
   PWA INSTALL PROMPT
   ============================================================ */
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("install-btn").classList.remove("hidden");
});
document.getElementById("install-btn").addEventListener("click", async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById("install-btn").classList.add("hidden");
});
window.addEventListener("appinstalled", () => { document.getElementById("install-btn").classList.add("hidden"); });

// iOS Safari has no beforeinstallprompt — show manual instructions once.
(function iosBanner() {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const isStandalone = window.navigator.standalone === true;
  if (isIOS && !isStandalone && !localStorage.getItem("ios-banner-dismissed")) {
    document.getElementById("ios-banner").classList.remove("hidden");
  }
  const dismiss = document.getElementById("ios-dismiss");
  if (dismiss) dismiss.addEventListener("click", () => {
    document.getElementById("ios-banner").classList.add("hidden");
    localStorage.setItem("ios-banner-dismissed", "1");
  });
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
